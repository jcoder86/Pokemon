// ---- opgeslagen spelers -----------------------------------------------------
// Naast Julians vaste profiel kan iedereen een eigen spel aanmaken met een naam
// en een hoofdpersoon. De lijst met spelers staat apart van hun voortgang; elk
// spel bewaart onder zijn eigen sleutel, dus ze zitten elkaar niet in de weg.
const SAVES_KEY = 'juliansPokemon.saves';
function readSaves() {
  try { const a = JSON.parse(localStorage.getItem(SAVES_KEY)); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function writeSaves(list) { try { localStorage.setItem(SAVES_KEY, JSON.stringify(list)); } catch (e) {} }
// het oude, naamloze gastprofiel blijft bestaan en wordt een gewone speler
function allSaves() {
  const list = readSaves();
  if (list.length) return list;
  let legacy = null;
  try { legacy = localStorage.getItem('juliansPokemon.guest'); } catch (e) {}
  if (legacy) { list.push({ p: 'guest', name: 'Gast', avatar: 'julian' }); writeSaves(list); }
  return list;
}

function drawAvatarPortrait(g, avatar, w, h) {
  g.clearRect(0, 0, w, h);
  drawJulian(g, w / 2, h * 0.97, 0, 'idle', 1.35, h / 76, avatar);
}

// hoeveel wezentjes heeft dit spel al gevangen? (zonder het spel te openen)
function savedCaughtCount(p) {
  try {
    const d = JSON.parse(localStorage.getItem('juliansPokemon.' + p));
    if (!d) return 1;
    if (d.caught && !Array.isArray(d.caught)) return Math.max(1, Object.keys(d.caught).length);
    if (Array.isArray(d.caught)) return Math.max(1, d.caught.filter(n => n > 0).length);
  } catch (e) {}
  return 1;
}

function renderSaveList() {
  const list = allSaves();
  saveList.innerHTML = '';
  list.forEach((s, k) => {
    const card = document.createElement('div');
    card.className = 'saveCard';
    const cnv = document.createElement('canvas'); cnv.width = 110; cnv.height = 150;
    drawAvatarPortrait(cnv.getContext('2d'), s.avatar, 110, 150);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
    const cnt = document.createElement('span'); cnt.className = 'cnt';
    cnt.textContent = '⭐ ' + savedCaughtCount(s.p);
    // het chipje toont de moeilijkheidsgraad en wisselt hem door bij een tik
    const chip = document.createElement('div');
    const setChip = () => {
      const d = DIFFS[s.d] ? s.d : 'easy';
      chip.className = 'diff d' + (DIFF_ORDER.indexOf(d) + 1);
      chip.textContent = DIFF_LABEL[d];
    };
    setChip();
    chip.addEventListener('pointerdown', e => {
      e.stopPropagation();
      const cu = allSaves();
      const nxt = DIFF_ORDER[(DIFF_ORDER.indexOf(DIFFS[s.d] ? s.d : 'easy') + 1) % 3];
      s.d = nxt; cu[k].d = nxt; writeSaves(cu);
      setChip();
      if (AC) SFX.tap();
    });
    card.appendChild(cnv); card.appendChild(nm); card.appendChild(cnt); card.appendChild(chip);
    card.addEventListener('pointerdown', e => { e.stopPropagation(); beginGame(s.p, s.avatar, s.d); });
    saveList.appendChild(card);
  });
  // zonder spellen alleen de aanmaakkolom tonen
  document.getElementById('saveListWrap').classList.toggle('leeg', list.length === 0);
}

});
let pickedDiff = 'easy';
document.querySelectorAll('.diffBtn').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.stopPropagation();
    pickedDiff = b.dataset.diff;
    document.querySelectorAll('.diffBtn').forEach(o => o.classList.toggle('sel', o === b));
    if (AC) SFX.tap();
  });
});
saveName.addEventListener('input', () => { btnNewGo.disabled = !saveName.value.trim(); });
saveName.addEventListener('keydown', e => { if (e.key === 'Enter' && saveName.value.trim()) createSave(); });

function beginGame(p, avatar, diff) {
  profile = p;
  G.avatar = AVATARS[avatar] ? avatar : 'julian';
  G.diff = DIFFS[diff] ? diff : 'easy';
  G.caught.fill(0); G.caughtCount = 0; G.active = STARTER;   // vers beginnen, dan pas laden
  G.asleep = {};
  loadProgress();
  updateBadge();
  audioInit();
  SFX.uiOpen();
  startOverlay.style.display = 'none';
  saveOverlay.style.display = 'none';
}
function openSavePicker() {
  saveName.value = ''; btnNewGo.disabled = true;
  pickedAvatar = 'julian'; paintAvatarChoices();
  pickedDiff = 'easy';
  document.querySelectorAll('.diffBtn').forEach(o => o.classList.toggle('sel', o.dataset.diff === 'easy'));
  renderSaveList();
  saveOverlay.style.display = 'flex';
}
document.getElementById('btnStart').addEventListener('pointerdown', e => { e.stopPropagation(); beginGame('julian', 'julian', 'easy'); });
document.getElementById('btnGuest').addEventListener('pointerdown', e => { e.stopPropagation(); openSavePicker(); });
document.getElementById('btnSaveBack').addEventListener('pointerdown', e => {
  e.stopPropagation(); saveOverlay.style.display = 'none';
});

// terug naar het startscherm: eerst bewaren, dan alles netjes terugzetten
function backToMenu() {
  saveProgress();
  if (AC) SFX.uiClose();
  G.bookOpen = false;
  bookOverlay.style.display = 'none';
  setBtns(false, false);
  btnFlee.style.display = 'none';
  G.state = 'world';
  G.onBoat = false;
  G.transT = 0;
  const pl = G.player;
  pl.x = 15.5 * TILE; pl.y = 13.2 * TILE;
  pl.tx = null; pl.ty = null; pl.path = null; pl.moving = false; pl.dir = 0;
  setArea('hub');
  profile = null;
  startOverlay.style.display = 'flex';
}
document.getElementById('btnHome').addEventListener('pointerdown', e => { e.stopPropagation(); backToMenu(); });
function createSave() {
  const name = saveName.value.trim().slice(0, 12);
  if (!name) return;
  const list = allSaves();
  const p = 'g' + Date.now().toString(36);
  list.push({ p, name, avatar: pickedAvatar, d: pickedDiff });
  writeSaves(list);
  try { localStorage.removeItem('juliansPokemon.' + p); } catch (e) {}   // altijd een vers spel
  beginGame(p, pickedAvatar, pickedDiff);
}
// het invoerveld mag de spelknop niet blokkeren als er nog niets staat
saveName.addEventListener('focus', () => { btnNewGo.disabled = !saveName.value.trim(); });
btnNewGo.addEventListener('pointerdown', e => { e.stopPropagation(); createSave(); });
btnNewGo.disabled = true;
paintAvatarChoices();
// Elk profiel krijgt een eigen kleur en een eigen portret op de knop, zodat
// Julian zonder te lezen ziet welke knop van hem is.
(function tekenProfielIconen() {
  const paar = [['btnStart', 'julian'], ['btnGuest', 'livea']];
  for (const [id, ava] of paar) {
    const c = document.getElementById(id).querySelector('.pic');
    if (c) drawAvatarPortrait(c.getContext('2d'), ava, c.width, c.height);
  }
})();
// Geen enkele aanraking zonder hoorbare reactie: knoppen die zelf geen geluid
// maken krijgen hier alsnog een tik mee.
const STIL = ['btnBook', 'btnMute', 'btnSaveBack', 'btnNewGo', 'btnStart', 'btnGuest'];
STIL.forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('pointerdown', () => { if (AC) SFX.tap(); });
});

// ============================================================ hoofdlus
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;
  G.t += dt;

  if (G.bookOpen) { /* boek open: de wereld en het gevecht wachten even */ }
  else if (G.state === 'world') { updateWorld(dt); updateParticles(dt); }
  else if (G.state === 'battle') { updateBattle(dt); updateParticles(dt); }
  else if (G.state === 'toBattle') {
    G.transT += dt; updateParticles(dt);
    if (G.transT >= 0.55) { G.state = 'battle'; G.particles.length = 0; }
  } else if (G.state === 'toWorld') {
    G.transT += dt; updateParticles(dt);
    if (G.transT >= 0.55) { G.state = 'world'; G.particles.length = 0; G.encounterCooldown = 2.5; }
  } else if (G.state === 'travelOut') {
    G.transT += dt;
    if (G.transT >= 0.55) {
      setArea(G.travelDest);
      const pl = G.player;
      pl.x = G.travelSpawn[0]; pl.y = G.travelSpawn[1];
      pl.moving = false; pl.tx = null; pl.path = null;
      G.onBoat = tileAt(pl.x, pl.y) === T_WATER;
      G.state = 'travelIn'; G.transT = 0;
      SFX.uiClose();
    }
  } else if (G.state === 'travelIn') {
    G.transT += dt; updateParticles(dt);
    if (G.transT >= 0.55) G.state = 'world';
  }

  if (G.state === 'world') drawWorld(ctx);
  else if (G.state === 'battle') drawBattle(ctx);
  else if (G.state === 'toBattle' || G.state === 'travelOut') {
    drawWorld(ctx);
    drawTransition(ctx, 1 - G.transT / 0.55);
  } else if (G.state === 'toWorld' || G.state === 'travelIn') {
    drawWorld(ctx);
    drawTransition(ctx, G.transT / 0.55);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

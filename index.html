// ---- gedeelde renderer voor de statische ondergrond + bosjes-laag van een gebied
function drawTuft(g, gx, gy, s, c) {
  g.fillStyle = c;
  g.beginPath();
  g.moveTo(gx, gy + 9 * s); g.quadraticCurveTo(gx + 1 * s, gy + 2 * s, gx - 2.5 * s, gy - 1 * s);
  g.quadraticCurveTo(gx + 3 * s, gy + 1.5 * s, gx + 3.5 * s, gy - 2.5 * s);
  g.quadraticCurveTo(gx + 5 * s, gy + 2.5 * s, gx + 8 * s, gy - 0.5 * s);
  g.quadraticCurveTo(gx + 7.5 * s, gy + 5 * s, gx + 6.5 * s, gy + 9 * s);
  g.closePath(); g.fill();
}
// ============================================================ terrein-passes
// Drie gedeelde passes over elke map, tussen de basistegels en de objecten in.
// Ze staan hier een keer en gelden dus voor alle gebieden tegelijk.
//   1. autotiling — elke grens tussen twee terreinsoorten krijgt een zachte
//      overgangsrand in plaats van een harde tegelnaad
//   2. waarde-scheiding — begaanbaar wordt consequent lichter, blokkerend
//      consequent donkerder. Alleen kleurverschil is voor een kind te weinig
//   3. expliciete randen — op de grens begaanbaar/niet-begaanbaar een donkere
//      zoom, plus contactschaduw zodat obstakels als massief lezen
const T_BLOCK = {};
T_BLOCK[T_TREE] = 1; T_BLOCK[T_ROCK] = 1; T_BLOCK[T_HOUSE] = 1; T_BLOCK[T_FENCE] = 1;
function isWalkTile(t) { return !T_BLOCK[t] && t !== T_WATER; }

// welke kleur krijgt de rand van tegel t, kijkend naar buur n?
function edgeTint(t, n) {
  if (T_BLOCK[n] && isWalkTile(t)) return 'rgba(22,32,16,0.42)';   // harde grens: donkere zoom
  if (n === T_WATER && isWalkTile(t)) return 'rgba(30,60,80,0.30)'; // vochtige oever
  if (t === T_WATER && isWalkTile(n)) return 'rgba(235,250,255,0.42)'; // schuimrand
  if (isWalkTile(t) && isWalkTile(n) && t !== n) return 'rgba(60,70,40,0.14)'; // zachte overgang
  return null;
}

function terrainPasses(wg, m) {
  const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH)
    ? m[clamp(y, 0, MH - 1)][clamp(x, 0, MW - 1)] : m[y][x];

  // --- 1 + 3. randen naar elke afwijkende buur ---
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = m[y][x], px = x * TILE, py = y * TILE;
    for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
      const n = at(x + dx, y + dy);
      if (n === t) continue;
      const tint = edgeTint(t, n);
      if (!tint) continue;
      const diep = T_BLOCK[n] ? 13 : 10;
      wg.save();
      wg.beginPath(); wg.rect(px, py, TILE, TILE); wg.clip();
      const gr = dy
        ? wg.createLinearGradient(0, py + (dy < 0 ? 0 : TILE), 0, py + (dy < 0 ? diep : TILE - diep))
        : wg.createLinearGradient(px + (dx < 0 ? 0 : TILE), 0, px + (dx < 0 ? diep : TILE - diep), 0);
      gr.addColorStop(0, tint); gr.addColorStop(1, 'rgba(0,0,0,0)');
      wg.fillStyle = gr; wg.fillRect(px, py, TILE, TILE);
      wg.restore();
    }
  }

  // --- 2. waarde-scheiding: begaanbaar lichter, blokkerend donkerder ---
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = m[y][x], px = x * TILE, py = y * TILE;
    if (isWalkTile(t)) wg.fillStyle = 'rgba(255,250,214,0.11)';
    else if (T_BLOCK[t]) wg.fillStyle = 'rgba(16,24,12,0.30)';
    else wg.fillStyle = 'rgba(14,30,48,0.14)';
    wg.fillRect(px, py, TILE, TILE);
  }

  // --- contactschaduw onder elk blokkerend vak: het signaal "hier niet door" ---
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!T_BLOCK[m[y][x]]) continue;
    if (T_BLOCK[at(x, y + 1)]) continue;              // alleen aan de onderrand van een cluster
    const px = x * TILE + TILE / 2, py = y * TILE + TILE;
    const gr = wg.createRadialGradient(px, py, 1, px, py, TILE * 0.72);
    gr.addColorStop(0, 'rgba(14,22,10,0.42)'); gr.addColorStop(1, 'rgba(14,22,10,0)');
    wg.fillStyle = gr;
    wg.beginPath(); wg.ellipse(px, py, TILE * 0.72, TILE * 0.3, 0, 0, TAU); wg.fill();
  }
}

// Meet of de squint-test slaagt: het gemiddelde grijs van begaanbaar terrein
// moet duidelijk lichter zijn dan dat van obstakels. Dit is de harde variant
// van de oog-test en draait over elk gebied.
function squintCheck(verbose) {
  const uit = [];
  for (const naam in AREAS) {
    const a = AREAS[naam];
    const c = document.createElement('canvas'); c.width = VW; c.height = VH;
    const cg = c.getContext('2d');
    cg.drawImage(a.world, 0, 0, VW, VH);
    const d = cg.getImageData(0, 0, VW, VH).data;
    let lw = 0, nw = 0, lb = 0, nb = 0;
    for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
      const t = a.map[ty][tx];
      const px = tx * TILE + 16, py = ty * TILE + 16;
      const i = (py * VW + px) * 4;
      const lum = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      if (isWalkTile(t)) { lw += lum; nw++; } else if (T_BLOCK[t]) { lb += lum; nb++; }
    }
    const mw = nw ? lw / nw : 0, mb = nb ? lb / nb : 0;
    const gat = mw - mb;
    uit.push({ gebied: naam, begaanbaar: Math.round(mw), obstakel: Math.round(mb),
               verschil: Math.round(gat), geslaagd: gat >= 25 });
  }
  if (verbose !== false) {
    uit.forEach(r => (r.geslaagd ? console.log : console.warn).call(console,
      '[squint] ' + r.gebied + ': begaanbaar ' + r.begaanbaar + ', obstakel ' + r.obstakel +
      ', verschil ' + r.verschil + (r.geslaagd ? ' — geslaagd' : ' — TE WEINIG SCHEIDING')));
  }
  return uit;
}

function renderArea(area) {
  const m = area.map, st = area.style;
  const base = document.createElement('canvas');
  base.width = VW * dpr; base.height = VH * dpr;
  const wg = base.getContext('2d'); wg.scale(dpr, dpr);
  const grass = document.createElement('canvas');
  grass.width = VW * dpr; grass.height = VH * dpr;
  const gg = grass.getContext('2d'); gg.scale(dpr, dpr);

  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = m[y][x], px = x * TILE, py = y * TILE;
    const h = hash2(x, y);
    wg.fillStyle = (x + y) % 2 === 0 ? st.g1 : st.g2;
    wg.fillRect(px, py, TILE, TILE);
    if (t === T_PATH) {
      wg.fillStyle = st.path; wg.fillRect(px, py, TILE, TILE);
      if (st.cobble) {
        wg.fillStyle = 'rgba(255,255,255,0.16)';
        wg.beginPath(); wg.ellipse(px + 9, py + 9, 6, 4.5, 0.3, 0, TAU); wg.fill();
        wg.beginPath(); wg.ellipse(px + 23, py + 13, 5.5, 4, -0.2, 0, TAU); wg.fill();
        wg.beginPath(); wg.ellipse(px + 14, py + 24, 6, 4.5, 0.1, 0, TAU); wg.fill();
        wg.fillStyle = 'rgba(60,60,50,0.18)';
        wg.beginPath(); wg.ellipse(px + 26, py + 25, 4.5, 3.5, 0, 0, TAU); wg.fill();
      } else if (st.boardwalk) {                           // houten vlonderpad
        wg.fillStyle = '#b8894f'; wg.fillRect(px, py, TILE, TILE);
        wg.fillStyle = '#a2743f';
        for (let i = 0; i < 3; i++) wg.fillRect(px, py + 1 + i * 11, TILE, 9);
        wg.fillStyle = 'rgba(255,235,190,0.35)';
        for (let i = 0; i < 3; i++) wg.fillRect(px, py + 1 + i * 11, TILE, 2);
        wg.fillStyle = 'rgba(90,60,30,0.35)';
        wg.fillRect(px + (h > 0.5 ? 10 : 20), py, 2, TILE);
      } else if (st.snowy) {                               // aangestampt sneeuwpad
        wg.fillStyle = st.path; wg.fillRect(px, py, TILE, TILE);
        wg.fillStyle = 'rgba(255,255,255,0.6)';
        if (h > 0.4) { wg.beginPath(); wg.ellipse(px + 8 + h * 14, py + 10 + h * 10, 6, 3, 0, 0, TAU); wg.fill(); }
        wg.fillStyle = 'rgba(150,175,200,0.35)';
        if (h > 0.7) { wg.beginPath(); wg.ellipse(px + 20 - h * 8, py + 22, 5, 2.6, 0, 0, TAU); wg.fill(); }
      } else {
        wg.fillStyle = 'rgba(160,120,60,0.25)';
        if (h > 0.5) wg.fillRect(px + 6 + h * 10, py + 8 + h * 8, 5, 4);
      }
    } else if (t === T_SAND) {
      wg.fillStyle = st.sand; wg.fillRect(px, py, TILE, TILE);
      wg.fillStyle = 'rgba(180,150,90,0.3)';
      if (h > 0.6) { wg.beginPath(); wg.arc(px + 10 + h * 10, py + 12 + h * 8, 1.5, 0, TAU); wg.fill(); }
    } else if (t === T_WATER) {
      wg.fillStyle = st.water; wg.fillRect(px, py, TILE, TILE);
      if (st.ice) {                                        // ijskoud water met drijvende ijsschotsen
        wg.strokeStyle = 'rgba(255,255,255,0.3)'; wg.lineWidth = 1.5;
        if (h > 0.5) { wg.beginPath(); wg.arc(px + 8 + h * 12, py + 9 + h * 10, 3.5, 0, Math.PI, true); wg.stroke(); }
        if (h > 0.62) {
          const fx = px + 5 + h * 12, fy = py + 8 + (h * 23 % 1) * 14, r = 5 + h * 5;
          wg.fillStyle = 'rgba(226,244,255,0.92)';
          wg.beginPath();
          wg.moveTo(fx - r, fy); wg.lineTo(fx - r * 0.4, fy - r * 0.75); wg.lineTo(fx + r * 0.6, fy - r * 0.6);
          wg.lineTo(fx + r, fy + r * 0.35); wg.lineTo(fx - r * 0.2, fy + r * 0.7);
          wg.closePath(); wg.fill();
          wg.fillStyle = 'rgba(255,255,255,0.95)';
          wg.beginPath();
          wg.moveTo(fx - r * 0.8, fy - r * 0.1); wg.lineTo(fx - r * 0.3, fy - r * 0.62);
          wg.lineTo(fx + r * 0.35, fy - r * 0.45); wg.lineTo(fx - r * 0.1, fy + r * 0.05);
          wg.closePath(); wg.fill();
        }
      } else {
        wg.strokeStyle = 'rgba(255,255,255,0.18)'; wg.lineWidth = 1.5;
        if (h > 0.55) { wg.beginPath(); wg.arc(px + 8 + h * 14, py + 8 + h * 12, 3.5, 0, Math.PI, true); wg.stroke(); }
        if (st.seafoam && h > 0.7) {                       // schuimkoppen op zee
          wg.strokeStyle = 'rgba(255,255,255,0.5)'; wg.lineWidth = 2.2;
          wg.beginPath(); wg.arc(px + 6 + h * 16, py + 20 - h * 8, 6, Math.PI * 0.15, Math.PI * 0.85); wg.stroke();
        }
      }
    } else if (t === T_TALL) {
      wg.fillStyle = st.tallBase; wg.fillRect(px, py, TILE, TILE);
      wg.fillStyle = st.snowy ? 'rgba(255,255,255,0.55)' : (st.palms ? 'rgba(190,180,90,0.35)' : 'rgba(30,70,25,0.35)');
      wg.fillRect(px + 3 + h * 8, py + 6 + h * 10, 9, 6);
      wg.fillRect(px + 16 - h * 6, py + 18, 8, 5);
    } else if (t === T_FIELD) {
      wg.fillStyle = '#b08a58'; wg.fillRect(px, py, TILE, TILE);
      wg.fillStyle = '#9a7444';
      for (let r = 0; r < 3; r++) wg.fillRect(px, py + 4 + r * 11, TILE, 4);
      if (h > 0.4) {
        wg.fillStyle = '#6fae3c';
        wg.beginPath(); wg.arc(px + 8 + h * 14, py + 6 + Math.floor(h * 3) * 11, 2.5, 0, TAU); wg.fill();
        wg.beginPath(); wg.arc(px + 18 - h * 8, py + 6 + Math.floor(h * 7 % 3) * 11, 2.2, 0, TAU); wg.fill();
      }
    } else if (t === T_GRASS) {
      if (st.flowers && h > 0.93) {
        const fc = h > 0.965 ? '#ff8fb3' : '#fff3a8';
        wg.fillStyle = fc;
        const fx = px + 8 + h * 12, fy = py + 8 + (h * 31 % 1) * 12;
        for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; wg.beginPath(); wg.ellipse(fx + Math.cos(a) * 3, fy + Math.sin(a) * 3, 2.2, 2.2, 0, 0, TAU); wg.fill(); }
        wg.fillStyle = '#f5a623'; wg.beginPath(); wg.arc(fx, fy, 2, 0, TAU); wg.fill();
      } else if (st.pebbles && h > 0.88) {
        // stenige plekjes
        const sx2 = px + 6 + h * 14, sy2 = py + 8 + (h * 23 % 1) * 14;
        wg.fillStyle = 'rgba(140,146,156,0.85)';
        wg.beginPath(); wg.ellipse(sx2, sy2, 4.5, 3.2, h * 2, 0, TAU); wg.fill();
        wg.beginPath(); wg.ellipse(sx2 + 7, sy2 + 4, 3, 2.2, h, 0, TAU); wg.fill();
        wg.fillStyle = 'rgba(180,186,196,0.8)';
        wg.beginPath(); wg.ellipse(sx2 - 1, sy2 - 1, 2.2, 1.6, h * 2, 0, TAU); wg.fill();
      } else if (st.ferns && h > 0.76) {
        // varentjes
        const fx2 = px + 8 + h * 14, fy2 = py + 16 + (h * 19 % 1) * 8;
        wg.strokeStyle = 'rgba(30,80,25,0.8)'; wg.lineWidth = 1.8; wg.lineCap = 'round';
        for (let i = -1; i <= 1; i++) {
          wg.beginPath(); wg.moveTo(fx2, fy2);
          wg.quadraticCurveTo(fx2 + i * 5, fy2 - 7, fx2 + i * 8, fy2 - 9 + Math.abs(i) * 3);
          wg.stroke();
        }
        wg.fillStyle = 'rgba(47,122,32,0.8)';
        for (let i = -1; i <= 1; i++) { wg.beginPath(); wg.ellipse(fx2 + i * 8, fy2 - 9 + Math.abs(i) * 3, 2.6, 1.6, i * 0.6, 0, TAU); wg.fill(); }
      } else if (st.shells && h > 0.8) {
        // schelpjes en zeesterren op het zand
        const sx2 = px + 8 + h * 14, sy2 = py + 10 + (h * 17 % 1) * 12;
        if (h > 0.93) {
          wg.fillStyle = '#f0a070';
          for (let i = 0; i < 5; i++) {
            const a = -Math.PI / 2 + i * TAU / 5;
            wg.beginPath(); wg.ellipse(sx2 + Math.cos(a) * 3.4, sy2 + Math.sin(a) * 3.4, 3.2, 2, a, 0, TAU); wg.fill();
          }
          wg.fillStyle = '#f8c8a0'; wg.beginPath(); wg.arc(sx2, sy2, 2, 0, TAU); wg.fill();
        } else {
          wg.fillStyle = h > 0.87 ? '#ffd8e4' : '#e8f0fa';
          wg.beginPath(); wg.moveTo(sx2, sy2 + 4);
          wg.arc(sx2, sy2 + 4, 5, Math.PI, TAU); wg.closePath(); wg.fill();
          wg.strokeStyle = 'rgba(190,150,150,0.6)'; wg.lineWidth = 1;
          for (let r = -1; r <= 1; r++) { wg.beginPath(); wg.moveTo(sx2, sy2 + 4); wg.lineTo(sx2 + r * 3.4, sy2 - 1); wg.stroke(); }
        }
      } else if (st.snowy && h > 0.78) {
        // sneeuwhoopjes en bevroren twijgjes
        wg.fillStyle = 'rgba(255,255,255,0.9)';
        const sx3 = px + 6 + h * 16, sy3 = py + 14 + (h * 13 % 1) * 10;
        wg.beginPath(); wg.ellipse(sx3, sy3, 7, 3.4, 0, 0, TAU); wg.fill();
        wg.beginPath(); wg.ellipse(sx3 + 6, sy3 + 2, 4.5, 2.4, 0, 0, TAU); wg.fill();
        if (h > 0.93) {
          wg.strokeStyle = '#8fa8bc'; wg.lineWidth = 1.4;
          wg.beginPath(); wg.moveTo(sx3, sy3); wg.lineTo(sx3 - 3, sy3 - 8); wg.stroke();
          wg.beginPath(); wg.moveTo(sx3 - 3, sy3 - 8); wg.lineTo(sx3 - 7, sy3 - 11); wg.stroke();
        }
      } else if (h > 0.88) {
        wg.fillStyle = 'rgba(50,110,40,0.5)';
        wg.fillRect(px + 6 + h * 14, py + 10, 2, 6); wg.fillRect(px + 10 + h * 10, py + 14, 2, 5);
      }
    }
  }
  // glans op het water
  const pc = area.pond;
  wg.fillStyle = 'rgba(255,255,255,0.12)';
  wg.beginPath(); wg.ellipse((pc[0] + pc[2]) / 2 * TILE, (pc[1] + pc[3]) / 2 * TILE, 70, 26, -0.4, 0, TAU); wg.fill();
  // hekjes
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (m[y][x] === T_FENCE) {
    const px = x * TILE, py = y * TILE;
    const horiz = (m[y][x - 1] === T_FENCE || m[y][x + 1] === T_FENCE);
    wg.fillStyle = '#9a7444';
    if (horiz) { wg.fillRect(px, py + 12, TILE, 4); wg.fillRect(px, py + 20, TILE, 4); }
    else { wg.fillRect(px + 14, py, 4, TILE); wg.fillRect(px + 22, py, 4, TILE); }
    wg.fillStyle = '#7a5a34';
    wg.fillRect(px + 4, py + 8, 5, 20); wg.fillRect(px + 23, py + 8, 5, 20);
    wg.fillStyle = '#b08a58'; wg.fillRect(px + 4, py + 8, 5, 3); wg.fillRect(px + 23, py + 8, 5, 3);
  }
  terrainPasses(wg, m, st);

  // rotsen
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (m[y][x] === T_ROCK) {
    const px = x * TILE + 16, py = y * TILE + 18;
    wg.fillStyle = 'rgba(40,60,30,0.2)'; wg.beginPath(); wg.ellipse(px, py + 9, 13, 4, 0, 0, TAU); wg.fill();
    wg.fillStyle = '#9aa3ad';
    wg.beginPath(); wg.moveTo(px - 13, py + 9); wg.lineTo(px - 9, py - 6); wg.lineTo(px - 1, py - 10);
    wg.lineTo(px + 9, py - 5); wg.lineTo(px + 13, py + 9); wg.closePath(); wg.fill();
    wg.fillStyle = '#c2cad2';
    wg.beginPath(); wg.moveTo(px - 9, py - 6); wg.lineTo(px - 1, py - 10); wg.lineTo(px + 3, py - 4);
    wg.lineTo(px - 4, py - 1); wg.closePath(); wg.fill();
    if (area.style.vines) {
      wg.strokeStyle = '#2c701f'; wg.lineWidth = 2;
      wg.beginPath(); wg.moveTo(px - 8, py + 6); wg.quadraticCurveTo(px - 2, py - 2, px + 6, py + 2); wg.stroke();
    }
    if (area.style.snowy) {                                // sneeuwkap op de rots
      wg.fillStyle = '#ffffff';
      wg.beginPath(); wg.moveTo(px - 10, py - 5); wg.lineTo(px - 1, py - 11); wg.lineTo(px + 9, py - 5);
      wg.quadraticCurveTo(px, py - 1, px - 10, py - 5); wg.closePath(); wg.fill();
    }
  }
  // bomen
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (m[y][x] === T_TREE) {
    const px = x * TILE + 16, py = y * TILE + 26;
    const h = hash2(x, y);
    wg.fillStyle = 'rgba(40,60,30,0.2)'; wg.beginPath(); wg.ellipse(px, py + 4, 12, 4, 0, 0, TAU); wg.fill();
    if (st.palms) {                                        // slanke palm met kokosnoten
      wg.strokeStyle = st.trunk; wg.lineWidth = 6; wg.lineCap = 'round';
      const lean = h > 0.5 ? 1 : -1;
      wg.beginPath(); wg.moveTo(px, py + 4);
      wg.quadraticCurveTo(px + lean * 5, py - 12, px + lean * 3, py - 26); wg.stroke();
      wg.strokeStyle = st.trunkDk; wg.lineWidth = 1.6;
      for (let i = 0; i < 4; i++) {
        const ty = py - 2 - i * 7;
        wg.beginPath(); wg.moveTo(px + lean * i * 0.9 - 3, ty); wg.lineTo(px + lean * i * 0.9 + 3, ty); wg.stroke();
      }
      const cx = px + lean * 3, cy2 = py - 26;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + h;
        wg.fillStyle = i % 2 ? st.canopy[0] : st.canopy[1];
        wg.save(); wg.translate(cx, cy2); wg.rotate(a);
        wg.beginPath(); wg.moveTo(0, 0);
        wg.quadraticCurveTo(9, -7, 20, -2);
        wg.quadraticCurveTo(9, 2, 0, 3); wg.closePath(); wg.fill();
        wg.restore();
      }
      wg.fillStyle = '#8a6438';
      wg.beginPath(); wg.arc(cx - 3, cy2 + 3, 3, 0, TAU); wg.fill();
      wg.beginPath(); wg.arc(cx + 4, cy2 + 4, 2.6, 0, TAU); wg.fill();
      continue;
    }
    if (st.pines) {                                        // besneeuwde spar
      wg.fillStyle = st.trunk; wg.fillRect(px - 3, py - 6, 6, 10);
      for (let i = 0; i < 3; i++) {
        const ty = py - 4 - i * 10, wdt = 15 - i * 4;
        wg.fillStyle = i % 2 ? st.canopy[0] : st.canopy[1];
        wg.beginPath(); wg.moveTo(px - wdt, ty); wg.lineTo(px, ty - 15); wg.lineTo(px + wdt, ty); wg.closePath(); wg.fill();
        wg.fillStyle = 'rgba(255,255,255,0.92)';            // sneeuw op de takken
        wg.beginPath(); wg.moveTo(px - wdt * 0.72, ty - 1);
        wg.lineTo(px, ty - 13); wg.lineTo(px + wdt * 0.72, ty - 1);
        wg.quadraticCurveTo(px, ty - 6, px - wdt * 0.72, ty - 1); wg.closePath(); wg.fill();
      }
      wg.fillStyle = '#ffffff'; wg.beginPath(); wg.arc(px, py - 38, 3.2, 0, TAU); wg.fill();
      continue;
    }
    wg.fillStyle = st.trunk; wg.fillRect(px - 3.5, py - 12, 7, 16);
    wg.fillStyle = st.trunkDk; wg.fillRect(px + 1, py - 12, 2.5, 16);
    wg.fillStyle = h > 0.5 ? st.canopy[0] : st.canopy[1];
    wg.beginPath(); wg.arc(px, py - 21, 14, 0, TAU); wg.fill();
    wg.beginPath(); wg.arc(px - 9, py - 13, 10, 0, TAU); wg.fill();
    wg.beginPath(); wg.arc(px + 9, py - 13, 10, 0, TAU); wg.fill();
    wg.fillStyle = h > 0.5 ? st.canopyDk[0] : st.canopyDk[1];
    wg.beginPath(); wg.arc(px + 5, py - 14, 8, 0, TAU); wg.fill();
    wg.fillStyle = 'rgba(255,255,255,0.14)';
    wg.beginPath(); wg.arc(px - 4, py - 25, 6, 0, TAU); wg.fill();
    if (st.vines && h > 0.45) {
      wg.strokeStyle = '#2c701f'; wg.lineWidth = 2;
      wg.beginPath(); wg.moveTo(px - 8, py - 14); wg.quadraticCurveTo(px - 10, py - 4, px - 7, py + 2); wg.stroke();
      wg.fillStyle = '#3f9230';
      wg.beginPath(); wg.ellipse(px - 7, py + 2, 3, 2, 0.4, 0, TAU); wg.fill();
      if (h > 0.75) {
        wg.beginPath(); wg.moveTo(px + 9, py - 12); wg.quadraticCurveTo(px + 12, py - 4, px + 10, py + 1); wg.stroke();
        wg.beginPath(); wg.ellipse(px + 10, py + 1, 3, 2, -0.4, 0, TAU); wg.fill();
      }
    }
  }
  // huisjes + molen
  for (const hh of area.houses) {
    const px = hh.x * TILE, py = hh.y * TILE, w = hh.w * TILE, hgt = hh.h * TILE;
    wg.fillStyle = 'rgba(40,60,30,0.2)'; wg.beginPath(); wg.ellipse(px + w / 2, py + hgt - 2, w * 0.55, 5, 0, 0, TAU); wg.fill();
    wg.fillStyle = hh.wall; wg.fillRect(px + 3, py + 16, w - 6, hgt - 18);
    wg.strokeStyle = 'rgba(120,90,60,0.4)'; wg.lineWidth = 1.5;
    wg.strokeRect(px + 3, py + 16, w - 6, hgt - 18);
    wg.fillStyle = hh.roof;
    wg.beginPath(); wg.moveTo(px - 3, py + 20); wg.lineTo(px + w / 2, py - 8); wg.lineTo(px + w + 3, py + 20); wg.closePath(); wg.fill();
    wg.fillStyle = 'rgba(0,0,0,0.15)';
    wg.beginPath(); wg.moveTo(px + w / 2, py - 8); wg.lineTo(px + w + 3, py + 20); wg.lineTo(px + w / 2, py + 20); wg.closePath(); wg.fill();
    wg.fillStyle = '#7a5a34';
    wg.beginPath(); wg.moveTo(px + w / 2 - 7, py + hgt - 2); wg.lineTo(px + w / 2 - 7, py + hgt - 22);
    wg.arc(px + w / 2, py + hgt - 22, 7, Math.PI, 0); wg.lineTo(px + w / 2 + 7, py + hgt - 2); wg.closePath(); wg.fill();
    wg.fillStyle = '#f5c518'; wg.beginPath(); wg.arc(px + w / 2 + 4, py + hgt - 12, 1.5, 0, TAU); wg.fill();
    wg.fillStyle = '#9fd4ff'; wg.fillRect(px + 9, py + 22, 12, 11);
    wg.strokeStyle = '#7a5a34'; wg.lineWidth = 2; wg.strokeRect(px + 9, py + 22, 12, 11);
    wg.beginPath(); wg.moveTo(px + 15, py + 22); wg.lineTo(px + 15, py + 33); wg.stroke();
    wg.fillStyle = '#9fd4ff'; wg.fillRect(px + w - 21, py + 22, 12, 11);
    wg.strokeStyle = '#7a5a34'; wg.strokeRect(px + w - 21, py + 22, 12, 11);
  }
  if (area.mill) {
    const mi = area.mill, px = mi.x * TILE, py = mi.y * TILE, w = mi.w * TILE, hgt = mi.h * TILE;
    wg.fillStyle = 'rgba(40,60,30,0.2)'; wg.beginPath(); wg.ellipse(px + w / 2, py + hgt - 2, w * 0.5, 6, 0, 0, TAU); wg.fill();
    wg.fillStyle = '#c8b8a0';
    wg.beginPath(); wg.moveTo(px + 14, py + hgt); wg.lineTo(px + 24, py + 8); wg.lineTo(px + w - 24, py + 8); wg.lineTo(px + w - 14, py + hgt); wg.closePath(); wg.fill();
    wg.fillStyle = 'rgba(120,100,70,0.35)';
    wg.beginPath(); wg.moveTo(px + w / 2, py + hgt); wg.lineTo(px + w / 2 - 4, py + 8); wg.lineTo(px + w - 24, py + 8); wg.lineTo(px + w - 14, py + hgt); wg.closePath(); wg.fill();
    wg.strokeStyle = '#9a8868'; wg.lineWidth = 2;
    for (let i = 1; i < 4; i++) { wg.beginPath(); wg.moveTo(px + 16 + i * 2, py + hgt - i * 18); wg.lineTo(px + w - 16 - i * 2, py + hgt - i * 18); wg.stroke(); }
    wg.fillStyle = '#8a5a35';
    wg.beginPath(); wg.arc(px + w / 2, py + 10, w / 2 - 22, Math.PI, 0); wg.closePath(); wg.fill();
    wg.fillStyle = '#7a5a34';
    wg.beginPath(); wg.moveTo(px + w / 2 - 6, py + hgt); wg.lineTo(px + w / 2 - 6, py + hgt - 16);
    wg.arc(px + w / 2, py + hgt - 16, 6, Math.PI, 0); wg.lineTo(px + w / 2 + 6, py + hgt); wg.closePath(); wg.fill();
    area.millHub = [px + w / 2, py + 10];
  }
  // doorgang-visuals: rotspoort of houten poort
  for (const po of area.portals) {
    if (po.icon === 'cave') {
      // open doorgang tussen twee bemoste rotspilaren, met blader-slinger
      const sx = po.side === 'left' ? 0 : VW, dir = po.side === 'left' ? 1 : -1;
      const cy = 11.5 * TILE;
      const pilX = sx + dir * 0.8 * TILE;
      // het pad loopt zichtbaar door tot de rand
      wg.fillStyle = 'rgba(255,248,200,0.25)';
      wg.fillRect(po.side === 'left' ? 0 : VW - 2 * TILE, cy - 0.5 * TILE, 2 * TILE, TILE);
      for (const vs of [-1, 1]) {
        const py = cy + vs * 1.9 * TILE;
        // schaduw + gestapelde rotsen
        wg.fillStyle = 'rgba(20,40,20,0.25)';
        wg.beginPath(); wg.ellipse(pilX, py + 0.55 * TILE, 0.62 * TILE, 0.18 * TILE, 0, 0, TAU); wg.fill();
        wg.fillStyle = '#8a8f98';
        wg.beginPath(); wg.ellipse(pilX, py + 0.25 * TILE, 0.58 * TILE, 0.42 * TILE, 0, 0, TAU); wg.fill();
        wg.fillStyle = '#9aa0aa';
        wg.beginPath(); wg.ellipse(pilX + dir * 2, py - 0.28 * TILE, 0.46 * TILE, 0.36 * TILE, 0, 0, TAU); wg.fill();
        wg.fillStyle = '#aab0ba';
        wg.beginPath(); wg.ellipse(pilX, py - 0.75 * TILE, 0.34 * TILE, 0.28 * TILE, 0, 0, TAU); wg.fill();
        wg.fillStyle = 'rgba(255,255,255,0.25)';
        wg.beginPath(); wg.ellipse(pilX - dir * 4, py - 0.85 * TILE, 0.14 * TILE, 0.1 * TILE, 0, 0, TAU); wg.fill();
        // mos-kruin
        wg.fillStyle = '#3f9230';
        wg.beginPath(); wg.ellipse(pilX, py - 0.95 * TILE, 0.3 * TILE, 0.13 * TILE, 0, 0, TAU); wg.fill();
        wg.fillStyle = '#2c701f';
        wg.beginPath(); wg.ellipse(pilX + dir * 4, py - 0.9 * TILE, 0.14 * TILE, 0.08 * TILE, 0, 0, TAU); wg.fill();
      }
      // blader-slinger tussen de pilaren door, over de opening heen
      const topY = cy - 1.55 * TILE, botY = cy + 1.55 * TILE, bow = sx + dir * 1.7 * TILE;
      wg.strokeStyle = '#2c701f'; wg.lineWidth = 6; wg.lineCap = 'round';
      wg.beginPath(); wg.moveTo(pilX, topY); wg.quadraticCurveTo(bow, cy, pilX, botY); wg.stroke();
      wg.strokeStyle = '#3f9230'; wg.lineWidth = 3;
      wg.beginPath(); wg.moveTo(pilX, topY); wg.quadraticCurveTo(bow, cy, pilX, botY); wg.stroke();
      const fcols = ['#ffd23d', '#ff8fb3', '#ffa64d', '#ff8fb3', '#ffd23d'];
      for (let i = 0; i < 5; i++) {
        const k = (i + 1) / 6;
        const lx = (1 - k) * (1 - k) * pilX + 2 * (1 - k) * k * bow + k * k * pilX;
        const ly = (1 - k) * (1 - k) * topY + 2 * (1 - k) * k * cy + k * k * botY;
        wg.fillStyle = '#3f9230';
        wg.beginPath(); wg.ellipse(lx + dir * 5, ly + 4, 6.5, 3.5, dir * 0.9, 0, TAU); wg.fill();
        wg.beginPath(); wg.ellipse(lx + dir * 3, ly - 5, 5.5, 3, dir * -0.7, 0, TAU); wg.fill();
        wg.fillStyle = fcols[i];
        wg.beginPath(); wg.arc(lx + dir * 2, ly, 3.2, 0, TAU); wg.fill();
      }
    } else if (po.icon === 'icegate') {
      // twee ijspilaren met ijspegels, zelfde opzet als de rotspoort
      const sx = po.side === 'left' ? 0 : VW, dir = po.side === 'left' ? 1 : -1;
      const cy = 11.5 * TILE, pilX = sx + dir * 0.8 * TILE;
      wg.fillStyle = 'rgba(210,240,255,0.5)';
      wg.fillRect(po.side === 'left' ? 0 : VW - 2 * TILE, cy - 0.5 * TILE, 2 * TILE, TILE);
      for (const vs of [-1, 1]) {
        const py = cy + vs * 1.9 * TILE;
        wg.fillStyle = 'rgba(90,130,170,0.28)';
        wg.beginPath(); wg.ellipse(pilX, py + 0.55 * TILE, 0.62 * TILE, 0.18 * TILE, 0, 0, TAU); wg.fill();
        wg.fillStyle = '#9fd0e8';
        wg.beginPath(); wg.moveTo(pilX - 0.6 * TILE, py + 0.6 * TILE);
        wg.lineTo(pilX - 0.34 * TILE, py - 1.0 * TILE); wg.lineTo(pilX + 0.34 * TILE, py - 1.0 * TILE);
        wg.lineTo(pilX + 0.6 * TILE, py + 0.6 * TILE); wg.closePath(); wg.fill();
        wg.fillStyle = '#c8ecfa';
        wg.beginPath(); wg.moveTo(pilX - 0.5 * TILE, py + 0.6 * TILE);
        wg.lineTo(pilX - 0.28 * TILE, py - 0.95 * TILE); wg.lineTo(pilX + 0.02 * TILE, py - 0.95 * TILE);
        wg.lineTo(pilX - 0.06 * TILE, py + 0.6 * TILE); wg.closePath(); wg.fill();
        wg.fillStyle = '#ffffff';                                   // sneeuwkap
        wg.beginPath(); wg.ellipse(pilX, py - 0.98 * TILE, 0.38 * TILE, 0.14 * TILE, 0, 0, TAU); wg.fill();
        for (let i = -1; i <= 1; i++) {                             // ijspegels
          const ix = pilX + i * 0.26 * TILE, iy = py + vs * 0.62 * TILE;
          wg.fillStyle = 'rgba(232,250,255,0.95)';
          wg.beginPath(); wg.moveTo(ix - 0.1 * TILE, iy); wg.lineTo(ix + 0.1 * TILE, iy);
          wg.lineTo(ix, iy + vs * 0.44 * TILE); wg.closePath(); wg.fill();
        }
      }
      // ijsboog over de opening
      const topY = cy - 1.55 * TILE, botY = cy + 1.55 * TILE, bow = sx + dir * 1.8 * TILE;
      wg.strokeStyle = '#8fc4e0'; wg.lineWidth = 9; wg.lineCap = 'round';
      wg.beginPath(); wg.moveTo(pilX, topY); wg.quadraticCurveTo(bow, cy, pilX, botY); wg.stroke();
      wg.strokeStyle = '#dff2ff'; wg.lineWidth = 4;
      wg.beginPath(); wg.moveTo(pilX, topY); wg.quadraticCurveTo(bow, cy, pilX, botY); wg.stroke();
      for (let i = 0; i < 5; i++) {
        const k = (i + 1) / 6;
        const lx = (1 - k) * (1 - k) * pilX + 2 * (1 - k) * k * bow + k * k * pilX;
        const ly = (1 - k) * (1 - k) * topY + 2 * (1 - k) * k * cy + k * k * botY;
        wg.fillStyle = 'rgba(232,250,255,0.95)';
        wg.beginPath(); wg.moveTo(lx - 5, ly); wg.lineTo(lx + 5, ly); wg.lineTo(lx + dir * 3, ly + 16); wg.closePath(); wg.fill();
        wg.fillStyle = '#ffffff';
        wg.beginPath(); wg.arc(lx + dir * 2, ly - 3, 3, 0, TAU); wg.fill();
      }
    } else if (po.icon === 'palmgate') {
      // twee palmstammen met een slingerlijn van schelpen en vlaggetjes
      const gx = 16 * TILE;
      // stam staat bij de rand, de kruin wijst naar binnen
      const baseY = po.side === 'top' ? 2.9 * TILE : VH - 0.4 * TILE;
      const crownY = baseY - 2.1 * TILE;
      wg.fillStyle = 'rgba(200,168,104,0.3)';
      wg.fillRect(gx - 1.4 * TILE, po.side === 'top' ? 0 : VH - 2.8 * TILE, 2.8 * TILE, 2.8 * TILE);
      for (const s of [-1, 1]) {
        const px = gx + s * 1.9 * TILE;
        wg.strokeStyle = '#b08450'; wg.lineWidth = 0.38 * TILE; wg.lineCap = 'round';
        wg.beginPath(); wg.moveTo(px, baseY); wg.quadraticCurveTo(px + s * 0.22 * TILE, baseY - 1.1 * TILE, px, crownY); wg.stroke();

// Na-pass over de obstakels zelf. De waarde-scheiding voor het tekenen van de
// objecten is niet genoeg: een besneeuwde rots of boom is daarna weer net zo
// licht als de sneeuw eronder, en dan verdwijnt het verschil tussen "hier kan
// ik lopen" en "hier niet". Deze pass duwt elk obstakel omlaag in waarde,
// inclusief het deel dat boven zijn eigen tegel uitsteekt.
function obstacleDarkenPass(wg, m) {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!T_BLOCK[m[y][x]]) continue;
    const px = x * TILE, py = y * TILE;
    const gr = wg.createLinearGradient(0, py - TILE * 1.1, 0, py + TILE);
    gr.addColorStop(0, 'rgba(24,34,44,0.30)');
    gr.addColorStop(0.72, 'rgba(20,28,34,0.26)');
    gr.addColorStop(1, 'rgba(16,22,26,0.10)');
    wg.fillStyle = gr;
    wg.fillRect(px, py - TILE * 1.1, TILE, TILE * 2.1);
  }
}

const AREAS = { hub: buildHub(), jungle: buildJungle(), village: buildVillage(), beach: buildBeach(), snow: buildSnow() };

function tileAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return T_TREE;
  return cur.map[ty][tx];
}
// lopen EN varen: bomen, rotsen, huizen en hekjes blokkeren; water is bevaarbaar
function solidAt(px, py) {
  const t = tileAt(px, py);
  return t === T_TREE || t === T_ROCK || t === T_HOUSE || t === T_FENCE;
}
function blocked(x, y) {
  return solidAt(x - 7, y - 2) || solidAt(x + 7, y - 2) || solidAt(x - 7, y - 11) || solidAt(x + 7, y - 11);
}
// ---- eenvoudige pathfinding (BFS over tegels) zodat een tik altijd aankomt
function pathWalkable(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return false;
  return !blocked(tx * TILE + TILE / 2, ty * TILE + TILE / 2);
}
function clearLine(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1), n = Math.ceil(d / 6);
  for (let i = 1; i < n; i++) { const k = i / n; if (blocked(lerp(x1, x2, k), lerp(y1, y2, k))) return false; }
  return true;
}
function findPath(sx, sy, txp, typ) {
  const W = MW, H = MH, key = (x, y) => y * W + x;
  const stx = clamp(Math.floor(sx / TILE), 0, W - 1), sty = clamp(Math.floor(sy / TILE), 0, H - 1);
  let gtx = clamp(Math.floor(txp / TILE), 0, W - 1), gty = clamp(Math.floor(typ / TILE), 0, H - 1);
  let goalPx = txp, goalPy = typ;
  // doel zelf geblokkeerd (boom/rots)? dichtstbijzijnde vrije tegel kiezen
  if (!pathWalkable(gtx, gty)) {
    let best = null, bd = 1e9;
    for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
      if (!pathWalkable(tx, ty)) continue;
      const dd = (tx - gtx) * (tx - gtx) + (ty - gty) * (ty - gty);
      if (dd < bd) { bd = dd; best = [tx, ty]; }
    }
    if (best) { gtx = best[0]; gty = best[1]; goalPx = gtx * TILE + TILE / 2; goalPy = gty * TILE + TILE / 2; }
  }
  let bstx = stx, bsty = sty;
  if (!pathWalkable(bstx, bsty)) { // speler op rare/geblokkeerde tegel: snap naar dichtstbijzijnde vrije
    let best = null, bd = 1e9;
    for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
      if (!pathWalkable(tx, ty)) continue;
      const dd = (tx - bstx) * (tx - bstx) + (ty - bsty) * (ty - bsty);
      if (dd < bd) { bd = dd; best = [tx, ty]; }
    }
    if (best) { bstx = best[0]; bsty = best[1]; } else return [[goalPx, goalPy]];
  }
  const prev = new Int32Array(W * H).fill(-2); // -2 onbezocht, -1 start
  prev[key(bstx, bsty)] = -1;
  const q = [key(bstx, bsty)]; let head = 0, found = false;
  const gk = key(gtx, gty);
  while (head < q.length) {
    const cur = q[head++];
    if (cur === gk) { found = true; break; }
    const cx = cur % W, cy = (cur - cx) / W;
    const nb = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
    for (const [nx, ny] of nb) {
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const k = key(nx, ny);
      if (prev[k] !== -2 || !pathWalkable(nx, ny)) continue;
      prev[k] = cur; q.push(k);
    }
  }
  if (!found) return [[goalPx, goalPy]];
  const tiles = [];
  for (let cur = gk; cur !== -1; cur = prev[cur]) {
    const cx = cur % W, cy = (cur - cx) / W;
    tiles.push([cx * TILE + TILE / 2, cy * TILE + TILE / 2]);
  }
  tiles.reverse(); tiles.shift(); // begin-tegel weg
  if (!blocked(goalPx, goalPy)) {
    if (tiles.length) tiles[tiles.length - 1] = [goalPx, goalPy]; else tiles.push([goalPx, goalPy]);
  }
  // gladstrijken: sla tussenpunten over zolang er vrij zicht is
  const out = []; let curX = sx, curY = sy, i = 0;
  while (i < tiles.length) {
    let j = tiles.length - 1;
    for (; j > i; j--) if (clearLine(curX, curY, tiles[j][0], tiles[j][1])) break;
    out.push(tiles[j]); curX = tiles[j][0]; curY = tiles[j][1]; i = j + 1;
  }
  return out.length ? out : [[goalPx, goalPy]];
}
function walkTo(px, py) {
  const pl = G.player;
  px = clamp(px, TILE * 0.5, VW - TILE * 0.5);
  py = clamp(py, TILE * 0.5, VH - TILE * 0.5);

}

// Makkelijk is precies het spel zoals het was en blijft de standaard. Moeilijk
// zet alle knoppen om: snellere mikringen, een beperkt aantal ballen en maatjes
// per gevecht, stevigere tegenstanders die soms dubbel raken, slapers die pas na

const DIFFS = {
  easy:   { ring: 1.00, balls: 0, pity: 2, team: 0, sleep: 0, hp: [0, 0], eBig: 0,    rare: 1.00 },
  normal: { ring: 1.35, balls: 5, pity: 3, team: 4, sleep: 1, hp: [0, 1], eBig: 0.13, rare: 0.60 },
  hard:   { ring: 1.75, balls: 3, pity: 0, team: 3, sleep: 3, hp: [1, 2], eBig: 0.26, rare: 0.35 },
};
const DIFF_ORDER = ['easy', 'normal', 'hard'];
const DIFF_LABEL = { easy: 'Makkelijk', normal: 'Gewoon', hard: 'Moeilijk' };

  let n = 0;
  for (let i = 0; i < NSPECIES; i++) if (G.caught[i] > 0 && !isAsleep(i)) n++;
  return n;
}

function registerFaint(i) {
  if (DF().sleep <= 0 || i < 0) return;
  if (G.caughtCount < 2) return;
  G.asleep[i] = DF().sleep;
}
// na elk gevecht slaapt iedereen een gevecht korter
function tickSleep() {
  for (const k in G.asleep) {
    G.asleep[k] -= 1;
    if (G.asleep[k] <= 0) delete G.asleep[k];
  }
  if (awakeCount() === 0) G.asleep = {};             // nooit helemaal zonder maatje
  if (isAsleep(G.active)) {
    for (let i = 0; i < NSPECIES; i++)
      if (G.caught[i] > 0 && !isAsleep(i)) { G.active = i; break; }
  }
}

function pickSpecies(pool) {
  const ids = [];
  for (let i = 0; i < NSPECIES; i++) if (i !== STARTER && SPECIES[i].pools.indexOf(pool) >= 0) ids.push(i);
  if (!ids.length) for (let i = 0; i < NSPECIES; i++) if (i !== STARTER) ids.push(i);
  let total = 0;
  const ws = ids.map(i => { const w = speciesWeight(i); total += w; return w; });
  let r = Math.random() * total;
  for (let k = 0; k < ids.length; k++) { r -= ws[k]; if (r <= 0) return ids[k]; }
  return ids[ids.length - 1];
}
function startEncounter(pool) {
  if (isAsleep(G.active)) {                 // nooit met een slaper het veld in
    for (let i = 0; i < NSPECIES; i++) if (G.caught[i] > 0 && !isAsleep(i)) { G.active = i; break; }
  }
  B.id = pickSpecies(pool);
  const hb = DF().hp;                        // tegenstanders zijn taaier op hoger niveau
  B.max = (SPECIES[B.id].hp || 3) + hb[0] + Math.floor(Math.random() * (hb[1] - hb[0] + 1));
  B.hearts = B.max;
  B.pMax = SPECIES[G.active].hp || 3;   // Julians maatje houdt zijn eigen hartjes
  B.pHearts = B.pMax;
  B.fainted = -1;
  B.balls = DF().balls;
  B.used = [G.active];
  B.eBig = false;
  B.phase = 'intro'; B.pt = 0; B.missCount = 0; B.ball = null;
  B.special = false; B.shake = 0;
  B.wFlash = 0; B.pFlash = 0; B.pLunge = 0; B.wLunge = 0; B.pcIn = 0;
  B.onWater = G.onBoat;
  G.state = 'toBattle'; G.transT = 0;
  G.player.moving = false; G.player.tx = null; G.player.path = null;
  setBtns(false, false);
  SFX.rustle(); SFX.battleStart();
}

// ============================================================ input
const battleBtns = document.getElementById('battleBtns');
const atkBtns = document.getElementById('atkBtns');
const btnAttack = document.getElementById('btnAttack');
const btnBall = document.getElementById('btnBall');
const btnFlee = document.getElementById('btnFlee');
const btnSpecial = document.getElementById('btnSpecial');
function hasSpecial() { return !!SPECIAL[SPECIES[G.active].draw]; }
function setBtns(showAttack, showBall) {
  battleBtns.style.display = showBall ? 'flex' : 'none';
  btnBall.style.display = showBall ? 'flex' : 'none';
  atkBtns.style.display = showAttack ? 'flex' : 'none';
  btnAttack.style.display = showAttack ? 'flex' : 'none';
  btnSpecial.style.display = (showAttack && hasSpecial()) ? 'flex' : 'none';
  btnSpecial.classList.remove('armed');
}

cv.addEventListener('pointerdown', e => {
  const p = canvasPos(e);
  if (G.state === 'world') {
    SFX.tap();
    // groot tik-doel op de doorgangen: loop er via het pad naartoe
    for (const po of cur.portals) {
      if (inRect(p.x, p.y, po.tap)) {
        walkTo(po.walk[0], po.walk[1]);
        spawnParticles(po.walk[0], po.walk[1], 5, 'star', ['#fff8c8', '#ffd23d']);
        return;
      }
    }
    walkTo(p.x, p.y);
    spawnParticles(p.x, p.y, 3, 'dot');
  } else if (G.state === 'battle') {
    // vergevingsgezind: elke tik doet de actie van dat moment
    if (B.phase === 'idle') doAttack();
    else if (B.phase === 'sAim') doSpecialStrike();
    else if (B.phase === 'aim') doThrow();
  }
});
btnSpecial.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if (G.state !== 'battle') return;
  if (B.phase === 'idle') armSpecial();
  else if (B.phase === 'sAim') doSpecialStrike();
});
btnAttack.addEventListener('pointerdown', e => { e.stopPropagation(); if (G.state === 'battle' && B.phase === 'idle') doAttack(); });
btnBall.addEventListener('pointerdown', e => { e.stopPropagation(); if (G.state === 'battle' && B.phase === 'aim') doThrow(); });
btnFlee.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if (G.state === 'battle' && B.phase !== 'caught' && B.phase !== 'throw') doFlee();
});

// De mikring krimpt helemaal weg tot een stipje. Klein genoeg = raak, en alleen
// op het stipje zelf telt het als dubbele klap.
// Drempels zijn omgerekend naar het nieuwe bereik: raak, krachtaanval en vangen
// blijven even moeilijk als eerst, alleen de dubbele klap is flink strakker.
const R_PERFECT = 0.16, R_HIT = 1.13, R_SPECIAL = 0.9, R_CATCH = 0.97;
function aimRadius(pt, speed) { return 4 + WILD.S * 2.3 * (0.5 + 0.5 * Math.sin(pt * speed)); }

function doAttack() {
  // mikken bij de aanval: hoe kleiner de ring, hoe harder de klap
  const perfect = B.ringR <= WILD.S * R_PERFECT;
  const hit = B.ringR <= WILD.S * R_HIT;
  B.dmg = perfect ? 2 : (hit ? 1 : 0);
  B.perfect = perfect; B.special = false;
  B.phase = 'pAtk'; B.pt = 0; B.didImpact = false;
  setBtns(false, false);
  if (B.dmg > 0) SFX.attackSnd(SPECIES[G.active].type);
  else SFX.wobble();
}
function armSpecial() {
  // de krachtige aanval: ring gaat veel sneller, dus mikken is lastiger
  B.phase = 'sAim'; B.pt = 0;
  btnAttack.style.display = 'none';            // even alleen de krachtaanval
  btnSpecial.classList.add('armed');
  SFX.charge();
}
function doSpecialStrike() {
  const hit = B.ringR <= WILD.S * R_SPECIAL;  // strakke zone: pittig maar haalbaar
  B.dmg = hit ? 2 : 0;                        // altijd twee hartjes, geen bonus
  B.perfect = false; B.special = true;
  B.phase = 'pAtk'; B.pt = 0; B.didImpact = false;
  setBtns(false, false);
  if (hit) { SFX.attackSnd(SPECIES[G.active].type); SFX.bigHit(); }
  else SFX.wobble();
}
function doThrow() {
  // mikken: gooi als de ring klein (groen) om het wezentje sluit
  const pity = DF().pity;
  B.willCatch = B.ringR <= WILD.S * R_CATCH || (pity > 0 && B.missCount >= pity);
  if (B.balls > 0) B.balls--;                 // beperkte voorraad telt af
  B.phase = 'throw'; B.pt = 0; B.wobbles = 0;
  setBtns(false, false);
  B.ball = { x: 250, y: 600 };
  SFX.throwBall();
}
// het gevecht netjes afsluiten: slapers een gevecht verder, terug naar de wereld
function endBattle() {
  tickSleep();
  saveProgress();
  setBtns(false, false);
  btnFlee.style.display = 'none';
  G.state = 'toWorld'; G.transT = 0;
}
function doFlee() {
  SFX.flee();
  endBattle();
}

// ============================================================ gevecht update
function updateBattle(dt) {
  B.pt += dt;
  B.wFlash = Math.max(0, B.wFlash - dt * 2.5);
  B.pFlash = Math.max(0, B.pFlash - dt * 2.5);
  B.shake = Math.max(0, B.shake - dt * 2.2);
  btnFlee.style.display = (B.phase !== 'caught' && B.phase !== 'throw' &&
    B.phase !== 'faint' && B.phase !== 'swap' &&
    B.phase !== 'retreat' && B.phase !== 'escape') ? 'flex' : 'none';
  const wildType = SPECIES[B.id].type;
  if (B.phase === 'intro') {
    B.pcIn = Math.min(1, B.pt / 0.5);
    if (B.pt > 0.55 && B.pt - dt <= 0.55) { SFX.cry(B.id); SFX.cry(G.active); }
    if (B.pt > 0.9) { B.phase = 'idle'; setBtns(true, false); }
  } else if (B.phase === 'idle') {
    B.ringR = aimRadius(B.pt, 3.4 * DF().ring);         // mikring voor de aanval
  } else if (B.phase === 'sAim') {
    // de krachtaanval is al de snelste ring; die krijgt maar de halve opslag
    B.ringR = aimRadius(B.pt, 7.6 * (1 + (DF().ring - 1) * 0.5));
  } else if (B.phase === 'pAtk') {
    B.pLunge = B.pt < 0.5 ? Math.sin(Math.min(B.pt / 0.5, 1) * Math.PI) : 0;
    if (!B.didImpact && B.pt >= 0.6) {
      B.didImpact = true;
      if (B.dmg > 0) {
        B.hearts = Math.max(0, B.hearts - B.dmg);
        B.wFlash = 1;
        SFX.hit(); SFX.heartPop();
        if (B.perfect) { SFX.sparkle(); SFX.heartPop(); }
        if (B.special) { SFX.heartPop(); B.shake = 1; }
        spawnParticles(WILD.x, WILD.y, B.special ? 40 : (B.perfect ? 26 : 16), 'star',
          [TYPECOL[SPECIES[G.active].type], '#ffffff', '#ffd23d']);
        if (B.special) spawnParticles(WILD.x, WILD.y, 24, 'confetti',
          [TYPECOL[SPECIES[G.active].type], '#ffffff']);
        if (B.hearts === 0) SFX.dizzy();
      } else {
        SFX.giggle();                                    // net ernaast: gewoon nog een keer
        spawnParticles(WILD.x + 90, WILD.y, 6, 'dot', ['#ffffff']);
      }
    }
    if (B.pt > 1.15) {
      if (B.hearts === 0) { B.phase = 'aim'; B.pt = 0; setBtns(false, true); }
      else {
        // op hoger niveau haalt de tegenstander soms een dubbele klap uit
        B.eBig = Math.random() < DF().eBig;
        B.phase = 'eAtk'; B.pt = 0; B.didImpact = false;
        SFX.attackSnd(wildType); if (B.eBig) SFX.charge();
      }
    }
  } else if (B.phase === 'eAtk') {
    B.wLunge = B.pt < 0.5 ? Math.sin(Math.min(B.pt / 0.5, 1) * Math.PI) : 0;
    if (!B.didImpact && B.pt >= 0.6) {
      B.didImpact = true;
      B.pHearts = Math.max(0, B.pHearts - (B.eBig ? 2 : 1));
      B.pFlash = 1;
      SFX.hitSoft();
      if (B.eBig) { SFX.bigHit(); B.shake = 1; }
      spawnParticles(PC.x, PC.y, B.eBig ? 26 : 10, 'star', [TYPECOL[wildType], '#ffffff']);
      if (B.eBig) spawnParticles(PC.x, PC.y, 16, 'confetti', [TYPECOL[wildType], '#ffffff']);
      if (B.pHearts === 0) SFX.dizzy();
    }
    if (B.pt > 1.15) {
      if (B.pHearts === 0) { B.phase = 'faint'; B.pt = 0; B.fainted = G.active; }
      else { B.phase = 'idle'; B.pt = 0; setBtns(true, false); }
    }
  } else if (B.phase === 'faint') {
    if (B.pt > 1.1) {
      registerFaint(B.fainted);
      // is er nog een wakker maatje dat vandaag nog niet meedeed?
      const lim = DF().team;
      const teamFull = lim > 0 && B.used.length >= lim;
      let others = 0;
      for (let i = 0; i < NSPECIES; i++)
        if (G.caught[i] > 0 && i !== B.fainted && !isAsleep(i)) others++;
      if (!teamFull && others > 0) { B.phase = 'swap'; B.pt = 0; setBtns(false, false); openBook(); }
      else if (lim > 0 || DF().sleep > 0) { B.phase = 'retreat'; B.pt = 0; setBtns(false, false); SFX.flee(); }
      else { B.phase = 'revive'; B.pt = 0; }
    }
  } else if (B.phase === 'retreat') {
    // maatjes op: Julian trekt zich terug. Geen game over, gewoon terug naar buiten.
    if (B.pt > 1.4) endBattle();
  } else if (B.phase === 'escape') {
    // ballen op: het wezentje wandelt rustig weg
    if (B.pt > 1.4) endBattle();
  } else if (B.phase === 'swap') {
    setBtns(false, false);                               // wachten tot er gekozen is
  } else if (B.phase === 'swapIn') {
    B.pcIn = Math.min(1, B.pt / 0.45);
    if (B.pt > 0.5 && B.pt - dt <= 0.5) SFX.cry(G.active);
    if (B.pt > 0.75) { B.phase = 'idle'; B.pt = 0; setBtns(true, false); }
  } else if (B.phase === 'revive') {
    if (B.pt > 0.7 && B.pt - dt <= 0.7) {
      SFX.revive();
      B.pHearts = B.pMax;
      B.fainted = -1;
      spawnParticles(PC.x, PC.y - 30, 18, 'star', ['#ffd23d', '#8fe05f', '#ffffff']);
    }
    if (B.pt > 1.3) { B.phase = 'idle'; B.pt = 0; setBtns(true, false); }
  } else if (B.phase === 'aim') {
    B.ringR = aimRadius(B.pt, 3.4 * DF().ring);
  } else if (B.phase === 'throw') {
    const fly = 0.45, absorb = 0.4, wobbleDur = 0.5, nWob = 2;
    const tIn = B.pt - fly, tWob = tIn - absorb;
    if (B.pt < fly) {
      B.ball.x = lerp(250, WILD.x, B.pt / fly);
      B.ball.y = lerp(600, WILD.y, B.pt / fly) - Math.sin(B.pt / fly * Math.PI) * 170;
    } else if (tIn < absorb) {
      B.ball.x = WILD.x; B.ball.y = WILD.y;
      if (tIn - dt < 0) { SFX.open(); spawnParticles(WILD.x, WILD.y, 10, 'dot'); }
    } else if (tWob < wobbleDur * nWob) {
      const w = Math.floor(tWob / wobbleDur);
      if (w > B.wobbles - 1 && tWob % wobbleDur < dt * 2) { SFX.wobble(); B.wobbles = w + 1; }
    } else {
      if (B.willCatch) {
        B.phase = 'caught'; B.pt = 0;
        B.isNew = !G.caught[B.id];
        G.caught[B.id]++;
        if (B.isNew) { G.caughtCount++; updateBadge(); }
        saveProgress();
        SFX.catchJingle();
        spawnParticles(WILD.x, WILD.y, 50, 'confetti');
        spawnParticles(WILD.x, WILD.y, 16, 'star');
      } else {
        B.phase = 'popout'; B.pt = 0; B.missCount++;
        SFX.open(); SFX.giggle();
        spawnParticles(WILD.x, WILD.y, 12, 'star');
      }
    }
  } else if (B.phase === 'popout') {
    B.ball = null;
    if (B.pt > 0.7) {
      if (DF().balls > 0 && B.balls <= 0) { B.phase = 'escape'; B.pt = 0; setBtns(false, false); SFX.flee(); }
      else { B.phase = 'aim'; B.pt = 0; setBtns(false, true); }
    }
  } else if (B.phase === 'caught') {
    B.ball = null;
    const end = B.isNew ? 2.6 : 1.6;
    if (B.isNew && B.pt > 0.7 && B.pt - dt <= 0.7) SFX.fanfare();
    if (B.pt > end) endBattle();
  }
}

// ============================================================ aanval-effecten per type
function drawFx(g, type, sx, sy, txx, tyy, prog, t) {
  const px = lerp(sx, txx, prog), py = lerp(sy, tyy, prog) - Math.sin(prog * Math.PI) * 80;
  switch (type) {
    case 'electric': {
      g.strokeStyle = '#ffd23d'; g.lineWidth = 8; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(sx, sy);
      for (let i = 1; i <= 6; i++) {
        const k = i / 6;
        g.lineTo(lerp(sx, px, k), lerp(sy, py, k) + (i < 6 ? Math.sin(t * 40 + i * 9) * 16 : 0));
      }
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 3; g.stroke();
      E(g, '#fff8c8', px, py, 10, 10);
      break;
    }
    case 'water':
      for (let i = 0; i < 4; i++)
        E(g, i % 2 ? '#9fd4ff' : '#58b6ff', px - i * 15 * Math.sign(txx - sx), py + Math.sin(t * 8 + i) * 7, 10 - i * 1.8, 12 - i * 2);
      break;
    case 'fire':
      E(g, 'rgba(255,122,31,0.45)', px, py, 18, 20);
      E(g, '#ff7a1f', px, py, 12, 14);
      E(g, '#ffd23d', px, py + 3, 7, 8);
      break;
    case 'grass':
      for (let i = 0; i < 3; i++) {
        g.save(); g.translate(px + Math.cos(t * 6 + i * 2.1) * 13, py + Math.sin(t * 6 + i * 2.1) * 13);
        g.rotate(t * 8 + i * 2); E(g, i % 2 ? '#6fc750' : '#8fdb6a', 0, 0, 11, 4.5); g.restore();
      }
      break;
    case 'wind':
      for (let i = 0; i < 3; i++)
        ARC(g, 'rgba(255,255,255,0.8)', px - i * 13 * Math.sign(txx - sx), py + (i - 1) * 6, 11 + i * 4, t * 6 + i, t * 6 + i + 4, 3.5);
      E(g, '#f4e3c2', px + 6, py - 8, 7, 3.5, 0.6);
      break;
    case 'bug':
      for (let i = 0; i < 3; i++) E(g, '#9adb4f', px - i * 14 * Math.sign(txx - sx), py + (i - 1) * 9, 8, 4);
      break;
    case 'rock':
      for (let i = 0; i < 2; i++) {
        g.save(); g.translate(px - i * 15 * Math.sign(txx - sx), py + i * 7); g.rotate(t * 7 + i);
        g.fillStyle = '#a8927a'; g.fillRect(-7, -6, 14, 12); g.restore();
      }
      break;
    case 'ghost':
      E(g, 'rgba(160,106,224,0.4)', px, py, 17, 17);
      E(g, '#a06ae0', px, py, 9, 9);
      E(g, 'rgba(160,106,224,0.3)', px - 14 * Math.sign(txx - sx), py + 4, 7, 7);
      break;
    case 'poison':
      for (let i = 0; i < 3; i++) {
        const bx = px - i * 14 * Math.sign(txx - sx), by = py + Math.sin(t * 7 + i * 2) * 8;
        E(g, 'rgba(154,95,200,0.45)', bx, by, 11 - i * 2, 11 - i * 2);
        E(g, '#9a5fc8', bx, by, 6 - i, 6 - i);
        E(g, 'rgba(255,255,255,0.6)', bx - 3, by - 3, 2.2, 2.2);
      }
      break;
    case 'fairy':
      for (let i = 0; i < 3; i++) {
        g.fillStyle = i % 2 ? '#ff9ec6' : '#ffd6e8';
        starPath(g, px - i * 12 * Math.sign(txx - sx), py + Math.sin(t * 9 + i) * 9, 9 - i * 2, 4); g.fill();
      }
      break;
    case 'psychic':
      for (let i = 0; i < 3; i++)
        ARC(g, 'rgba(224,112,192,0.65)', txx, tyy, 16 + ((prog * 90 + i * 24) % 75), 0, TAU, 3);
      break;
    default:
      g.save(); g.translate(px, py); g.rotate(t * 12);
      g.fillStyle = '#ffd23d'; starPath(g, 0, 0, 16, 7); g.fill(); g.restore();
  }
}

// Eén projectiel van een type op een punt: het bouwsteentje van de krachtaanval.
// Zo hoeft de bulk-versie niets per wezen te weten en werkt hij voor alle 150.
function fxToken(g, type, x, y, s, t, i) {
  switch (type) {
    case 'fire':
      E(g, 'rgba(255,122,31,0.4)', x, y, s * 1.5, s * 1.8);
      E(g, '#ff7a1f', x, y, s, s * 1.25);
      E(g, '#ffd23d', x, y + s * 0.3, s * 0.55, s * 0.7);
      break;
    case 'water':
      E(g, 'rgba(88,182,255,0.4)', x, y, s * 1.25, s * 1.6);
      E(g, '#58b6ff', x, y, s * 0.85, s * 1.3);
      E(g, '#c8ebff', x - s * 0.3, y - s * 0.35, s * 0.34, s * 0.5);
      break;
    case 'electric':
      g.strokeStyle = '#ffd23d'; g.lineWidth = s * 0.5; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath();
      g.moveTo(x - s * 0.5, y - s * 1.5); g.lineTo(x + s * 0.45, y - s * 0.3);
      g.lineTo(x - s * 0.35, y + s * 0.2); g.lineTo(x + s * 0.5, y + s * 1.5);
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = s * 0.2; g.stroke();
      break;
    case 'grass':
      g.save(); g.translate(x, y); g.rotate(t * 5 + i);
      E(g, i % 2 ? '#6fc750' : '#8fdb6a', 0, 0, s * 1.3, s * 0.55);
      LN(g, 'rgba(40,90,30,0.35)', s * 0.12, [[-s * 1.1, 0], [s * 1.1, 0]]);
      g.restore();
      break;
    case 'rock':
      g.save(); g.translate(x, y); g.rotate(t * 4 + i);
      PG(g, '#a8927a', [[-s, -s * 0.8], [s * 0.7, -s], [s, s * 0.7], [-s * 0.8, s]]);
      PG(g, 'rgba(255,255,255,0.18)', [[-s, -s * 0.8], [s * 0.7, -s], [0, 0]]);
      g.restore();
      break;
    case 'poison':
      E(g, 'rgba(154,95,200,0.45)', x, y, s * 1.35, s * 1.35);
      E(g, '#9a5fc8', x, y, s * 0.85, s * 0.85);
      E(g, 'rgba(255,255,255,0.6)', x - s * 0.35, y - s * 0.35, s * 0.26, s * 0.26);
      break;
    case 'ghost':
      E(g, 'rgba(160,106,224,0.35)', x, y, s * 1.5, s * 1.5);
      E(g, '#a06ae0', x, y, s * 0.9, s * 0.9);
      E(g, '#d8c0f8', x - s * 0.3, y - s * 0.3, s * 0.28, s * 0.28);
      break;
    case 'bug':
      E(g, '#9adb4f', x, y, s * 0.9, s * 1.15);
      E(g, 'rgba(255,255,255,0.4)', x - s * 0.25, y - s * 0.4, s * 0.28, s * 0.34);
      break;
    case 'psychic':
      ARC(g, 'rgba(224,112,192,0.85)', x, y, s * 1.15, 0, TAU, s * 0.34);
      E(g, 'rgba(255,190,240,0.6)', x, y, s * 0.5, s * 0.5);
      break;
    case 'fairy':
      g.fillStyle = i % 2 ? '#ff9ec6' : '#ffd6e8';
      starPath(g, x, y, s * 1.25, s * 0.55); g.fill();
      break;
    case 'wind':
      ARC(g, 'rgba(255,255,255,0.85)', x, y, s * 1.1, t * 6 + i, t * 6 + i + 4.2, s * 0.34);
      E(g, 'rgba(240,250,255,0.5)', x, y, s * 0.45, s * 0.45);
      break;
    default:
      g.save(); g.translate(x, y); g.rotate(t * 8 + i);
      g.fillStyle = '#ffd23d'; starPath(g, 0, 0, s * 1.3, s * 0.6); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.55)'; starPath(g, 0, 0, s * 0.6, s * 0.28); g.fill();
      g.restore();
  }
}

// De krachtaanval: dezelfde aanval als de gewone, maar dan in bulk en van boven
// naar beneden. Een regen van elf projectielen met staart, die op het doel
// inslaan. Werkt voor elk type en dus voor elk wezen dat de aanval heeft.
function drawFxBig(g, type, sx, sy, txx, tyy, prog, t) {
  const col = TYPECOL[type] || '#ffd23d';
  const N = 11;
  for (let i = 0; i < N; i++) {
    const p = prog * 1.6 - i * 0.05;
    if (p <= 0) continue;
    const lane = ((i * 5) % N) / (N - 1) - 0.5;             // gespreide banen
    const x0 = txx + lane * 340, y0 = -80 - (i % 3) * 60;
    const x1 = txx + lane * 130, y1 = tyy + ((i * 7) % 5 - 2) * 24;
    const s = 16 + (i % 3) * 5;
    if (p < 1) {
      for (let q = 3; q >= 1; q--) {                        // staart naar boven
        const kk = Math.max(0, p - q * 0.055);
        g.save(); g.globalAlpha = 0.3 - q * 0.06;
        fxToken(g, type, lerp(x0, x1, kk), lerp(y0, y1, kk), s * (1 - q * 0.17), t, i);
        g.restore();
      }
      fxToken(g, type, lerp(x0, x1, p), lerp(y0, y1, p), s, t, i);
    } else {                                                 // inslag met vonken
      const b = clamp(p - 1, 0, 1);
      g.save(); g.globalAlpha = 1 - b;
      ARC(g, col, x1, y1, 12 + b * 50, 0, TAU, 7 * (1 - b));
      for (let q = 0; q < 5; q++) {
        const a = q * TAU / 5 + i * 0.9;
        fxToken(g, type, x1 + Math.cos(a) * b * 46, y1 + Math.sin(a) * b * 32, s * 0.5 * (1 - b), t, i + q);
      }
      g.restore();
    }
  }
  E(g, 'rgba(255,255,255,' + (0.16 * Math.sin(clamp(prog, 0, 1) * Math.PI)).toFixed(3) + ')', txx, tyy, 130, 105);
}

function drawHeartsRow(g, cx, cy, n, max, size, t) {
  for (let i = 0; i < max; i++) {
    const hx = cx - (max - 1) * size * 1.4 + i * size * 2.8, full = i < n;
    g.fillStyle = full ? '#ff5a78' : 'rgba(120,120,120,0.35)';
    const pulse = full ? 1 + Math.sin(t * 4 + i) * 0.06 : 1;
    heartPath(g, hx, cy, size * pulse); g.fill();
    if (full) { E(g, 'rgba(255,255,255,0.5)', hx - size * 0.3, cy - size * 0.38, size * 0.2, size * 0.16); }
  }
}

    for (let i = 0; i < 14; i++) {                            // dwarrelende sneeuwvlokjes

      g.fillStyle = 'rgba(255,255,255,0.8)';

    }
  } else {
    g.fillStyle = G.area === 'village' ? '#c2dd8e' : '#b8e29a';
    g.beginPath(); g.ellipse(180, 430, 320, 120, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(850, 460, 380, 140, 0, 0, TAU); g.fill();
    if (G.area === 'village') {
      g.fillStyle = '#e8d8b8';
      g.fillRect(150, 330, 90, 80);
      PG(g, '#c0563e', [[140, 335], [195, 290], [250, 335]]);
      g.fillStyle = '#7a5a34'; g.fillRect(185, 375, 22, 35);
    }
  }
  g.fillStyle = '#fff3a8'; g.beginPath(); g.arc(110, 95, 48, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,243,168,0.4)'; g.beginPath(); g.arc(110, 95, 60, 0, TAU); g.fill();
  const platC = B.onWater ? '#7ac4ea' : (G.area === 'jungle' ? '#5fa050'
    : G.area === 'beach' ? '#e8cf94' : G.area === 'snow' ? '#e4eef8' : '#8fce62');
  const platH = B.onWater ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.25)';
  g.fillStyle = platC;
  g.beginPath(); g.ellipse(WILD.x, WILD.y + 95, 170, 42, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(PC.x, PC.y + 80, 165, 42, 0, 0, TAU); g.fill();
  g.fillStyle = platH;
  g.beginPath(); g.ellipse(WILD.x, WILD.y + 88, 120, 24, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(PC.x, PC.y + 74, 115, 24, 0, 0, TAU); g.fill();

  // Julian moedigt aan vanaf links
  drawJulian(g, 110, 660, 3, B.phase === 'caught' ? 'cheer' : 'idle', G.t, 2.9);

  // Julians eigen wezentje
  const pcX = lerp(-90, PC.x, B.pcIn) + B.pLunge * 150;
  let pcMood = 'idle';
  if (B.phase === 'faint' || B.phase === 'swap') pcMood = 'faint';
  else if (B.phase === 'revive') pcMood = B.pt < 0.7 ? 'faint' : 'happy';
  else if (B.phase === 'pAtk' && B.pLunge > 0.2) pcMood = 'attack';
  else if (B.phase === 'caught') pcMood = 'happy';
  const pcId = (B.phase === 'faint' || B.phase === 'swap' || B.phase === 'retreat') && B.fainted >= 0
    ? B.fainted : G.active;
  if (B.phase === 'retreat') pcMood = 'faint';
  // terugtrekken: het slapende maatje glijdt met Julian mee naar buiten
  const pcOut = B.phase === 'retreat' ? clamp((B.pt - 0.4) / 1.0, 0, 1) : 0;
  drawCreature(g, pcId, pcX - pcOut * 420, PC.y, PC.S * (1 - pcOut * 0.4), G.t, pcMood, B.pFlash);

  // wild wezentje
  const wScale = B.phase === 'intro' ? Math.min(1, B.pt / 0.5) : 1;
  let wMood = 'idle';
  if (B.hearts === 0 && B.phase !== 'caught') wMood = 'dizzy';
  if (B.phase === 'eAtk' && B.wLunge > 0.2) wMood = 'attack';
  if (B.phase === 'caught') wMood = 'happy';
  let wShow = true, wS = WILD.S * wScale, wx = WILD.x - B.wLunge * 150, wy = WILD.y;
  if (B.phase === 'throw') {
    const tIn = B.pt - 0.45;
    if (tIn > 0) { const k = clamp(tIn / 0.4, 0, 1); wS *= (1 - k); wy -= k * 30; }
    if (tIn > 0.4) wShow = false;
  }
  if (B.phase === 'popout') wS *= clamp(B.pt / 0.25, 0, 1);
  if (B.phase === 'caught') wShow = false;
  if (B.phase === 'escape') {          // ballen op: het wezentje huppelt weg
    const k = clamp((B.pt - 0.3) / 1.0, 0, 1);
    wx += k * 460; wy -= Math.abs(Math.sin(B.pt * 9)) * 26 * (1 - k);
    wS *= (1 - k * 0.45); wMood = 'happy';
  }
  if (wShow && wS > 1) drawCreature(g, B.id, wx, wy, wS, G.t, wMood, B.wFlash);

  // hartjes
  if (B.phase !== 'caught' && B.phase !== 'escape') {
    drawHeartsRow(g, WILD.x, 130, B.hearts, B.max, 24, G.t);
    if (B.phase !== 'retreat') drawHeartsRow(g, PC.x, PC.y - 125, B.pHearts, B.pMax, 13, G.t + 1);
  }
  // hoeveel maatjes mogen er nog mee dit gevecht? (alleen bij een limiet)
  if (DF().team > 0 && B.phase !== 'caught') {
    const left = Math.max(0, DF().team - B.used.length);
    for (let i = 0; i < DF().team; i++) {
      const bx = PC.x - (DF().team - 1) * 13 + i * 26, on = i < B.used.length;
      E(g, on ? 'rgba(120,120,120,0.35)' : '#8fe05f', bx, PC.y - 148, 8, 8);
      if (!on) E(g, 'rgba(255,255,255,0.6)', bx - 2.4, PC.y - 150.6, 2.6, 2.2);
    }
    if (left === 0) { /* laatste maatje: de stipjes staan allemaal uit */ }
  }
  // resterende ballen bij een beperkte voorraad
  if (DF().balls > 0 && (B.phase === 'aim' || B.phase === 'popout' || B.phase === 'throw')) {
    for (let i = 0; i < DF().balls; i++) {
      const bx = 512 - (DF().balls - 1) * 30 + i * 60, by = 545, on = i < B.balls;
      g.save(); g.globalAlpha = on ? 1 : 0.25;
      E(g, 'rgba(0,0,0,0.18)', bx, by + 3, 19, 19);
      E(g, '#ffffff', bx, by, 18, 18);
      g.save();
      g.beginPath(); g.arc(bx, by, 18, 0, TAU); g.clip();
      E(g, '#f9c513', bx, by - 9, 19, 11);
      g.fillStyle = '#3a4a8c'; g.fillRect(bx - 19, by - 3, 38, 5);
      g.restore();
      E(g, '#3a4a8c', bx, by, 7, 7); E(g, '#ffffff', bx, by, 4, 4);
      g.restore();
    }
  }

  // aanval-effect onderweg
  if (B.phase === 'pAtk' && B.pt >= 0.22 && B.pt <= 0.62) {
    const prog = clamp((B.pt - 0.22) / 0.38, 0, 1);
    if (B.special) drawFxBig(g, SPECIES[G.active].type, PC.x + 70, PC.y - 30, WILD.x, WILD.y, prog, G.t);
    else drawFx(g, SPECIES[G.active].type, PC.x + 70, PC.y - 30, WILD.x, WILD.y, prog, G.t);
  }
  if (B.special && B.phase === 'pAtk' && B.pt > 0.6 && B.pt < 0.95) {   // inslag-flits
    const k = 1 - (B.pt - 0.6) / 0.35;
    g.fillStyle = 'rgba(255,255,255,' + (0.45 * k) + ')';
    g.fillRect(0, 0, VW, VH);
    g.strokeStyle = TYPECOL[SPECIES[G.active].type]; g.lineWidth = 10 * k;
    g.beginPath(); g.arc(WILD.x, WILD.y, 110 + (1 - k) * 190, 0, TAU); g.stroke();
  }
  if (B.phase === 'eAtk' && B.pt >= 0.22 && B.pt <= 0.62) {
    const prog = clamp((B.pt - 0.22) / 0.38, 0, 1);
    // een dubbele klap van de tegenstander ziet er net zo imponerend uit
    if (B.eBig) drawFxBig(g, SPECIES[B.id].type, WILD.x - 80, WILD.y, PC.x, PC.y - 20, prog, G.t);
    else drawFx(g, SPECIES[B.id].type, WILD.x - 80, WILD.y, PC.x, PC.y - 20, prog, G.t);
  }
  if (B.eBig && B.phase === 'eAtk' && B.pt > 0.6 && B.pt < 0.95) {      // inslag-flits
    const k = 1 - (B.pt - 0.6) / 0.35;
    g.fillStyle = 'rgba(255,255,255,' + (0.35 * k) + ')';

  if (B.phase === 'sAim') {
    const hit = B.ringR <= WILD.S * R_SPECIAL;
    const col = TYPECOL[SPECIES[G.active].type] || '#ffd23d';
    g.save();
    g.strokeStyle = hit ? col : 'rgba(216,168,255,0.9)';

    g.beginPath(); g.arc(WILD.x, WILD.y, B.ringR, 0, TAU); g.stroke();

    g.beginPath(); g.arc(WILD.x, WILD.y, B.ringR, 0, TAU); g.stroke();
    g.restore();
    // het maatje laadt zichtbaar op

    for (let i = 0; i < 6; i++) {

  if (B.phase === 'idle') {
    const perfect = B.ringR <= WILD.S * R_PERFECT, hit = B.ringR <= WILD.S * R_HIT;
    g.save();

    g.lineWidth = perfect ? 11 : (hit ? 9 : 6);
    g.setLineDash([16, 11]); g.lineDashOffset = -G.t * 46;
    g.beginPath(); g.arc(WILD.x, WILD.y, B.ringR, 0, TAU); g.stroke();
    g.restore();
    if (perfect) {                       // helemaal dichtgeknepen: het gouden stipje
      E(g, 'rgba(255,210,61,0.35)', WILD.x, WILD.y, 26, 26);
      E(g, '#ffd23d', WILD.x, WILD.y, 9, 9);
      E(g, '#fff8c8', WILD.x, WILD.y, 4, 4);
      g.fillStyle = '#ffd23d';
      for (let i = 0; i < 5; i++) {
        const a = G.t * 3 + i * TAU / 5;
        starPath(g, WILD.x + Math.cos(a) * 42, WILD.y + Math.sin(a) * 42, 12, 5);
        g.fill();
      }
    }
  }
  // dubbele-klap teken
  if (B.phase === 'pAtk' && B.perfect && B.pt > 0.6 && B.pt < 1.1) {
    g.fillStyle = '#ffd23d';
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + G.t * 2;
      starPath(g, WILD.x + Math.cos(a) * 120, WILD.y + Math.sin(a) * 120, 16, 7); g.fill();
    }
  }
  // mik-ring voor de bal
  if (B.phase === 'aim') {
    const sweet = B.ringR <= WILD.S * R_CATCH;
    g.save();
    g.strokeStyle = sweet ? '#52d669' : 'rgba(255,255,255,0.85)';
    g.lineWidth = sweet ? 9 : 6;
    g.setLineDash([18, 12]); g.lineDashOffset = -G.t * 40;
    g.beginPath(); g.arc(WILD.x, WILD.y, B.ringR, 0, TAU); g.stroke();
    g.restore();
    if (sweet) {
      g.fillStyle = '#52d669';
      for (let i = 0; i < 4; i++) {
        const a = G.t * 2 + i * TAU / 4;
        starPath(g, WILD.x + Math.cos(a) * (B.ringR + 22), WILD.y + Math.sin(a) * (B.ringR + 22), 10, 4.5);
        g.fill();
      }
    }
  }

  // bal
  if (B.ball) {
    const tWob = B.pt - 0.45 - 0.4;
    let rot = 0, bx = B.ball.x, by = B.ball.y;
    if (B.pt < 0.45) rot = B.pt * 14;
    else if (tWob > 0) { rot = Math.sin(tWob * 11) * 0.32; by = WILD.y + 60; }

    drawBall(g, WILD.x, WILD.y + 60, 26);

    for (let i = 0; i < 3; i++) {

      starPath(g, WILD.x + Math.cos(a) * 70, WILD.y + 60 + Math.sin(a) * 28, 12, 5); g.fill();
    }

      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.beginPath(); g.arc(VW / 2, 330, 190 * k, 0, TAU); g.fill();
      g.fillStyle = '#ffd23d';
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU + G.t * 0.8;
        starPath(g, VW / 2 + Math.cos(a) * 225 * k, 330 + Math.sin(a) * 225 * k, 16, 7); g.fill();
      }
      drawCreature(g, B.id, VW / 2, 330, 110 * k, G.t, 'happy', 0);
      g.restore();
    }
  }
  drawParticles(g);
}
function drawBall(g, x, y, r) {

  g.fillStyle = '#f9c513'; g.fillRect(x - r, y - r, r * 2, r * 0.88);
  g.fillStyle = '#3a4a8c'; g.fillRect(x - r, y - r * 0.16, r * 2, r * 0.32);
  g.restore();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r * 0.32, 0, TAU); g.fill();
  g.strokeStyle = '#3a4a8c'; g.lineWidth = r * 0.14;
  g.beginPath(); g.arc(x, y, r * 0.32, 0, TAU); g.stroke();
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.5)'; ell(g, x - r * 0.35, y - r * 0.5, r * 0.18, r * 0.12);
}

// ============================================================ wereld update
function updateWorld(dt) {
  const pl = G.player;
  G.encounterCooldown = Math.max(0, G.encounterCooldown - dt);
  if (pl.moving && pl.path && pl.path.length) {
    let budget = (G.onBoat ? 195 : 175) * dt, moved = false;
    while (budget > 0 && pl.path.length) {
      const wp = pl.path[0];
      const dx = wp[0] - pl.x, dy = wp[1] - pl.y, d = Math.hypot(dx, dy);
      pl.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 0 : 1);
      if (d <= budget) {
        pl.x = wp[0]; pl.y = wp[1]; budget -= d; pl.path.shift(); moved = true;
      } else {
        const nx = pl.x + dx / d * budget, ny = pl.y + dy / d * budget;
        if (!blocked(nx, ny)) { pl.x = nx; pl.y = ny; moved = true; } else { pl.path.shift(); }
        budget = 0;
      }
    }
    if (!pl.path.length) { pl.moving = false; pl.tx = null; }
    if (moved) {
      pl.stepT += dt;
      if (pl.stepT > 0.22) {
        pl.stepT = 0; pl.stepN++;
        if (G.onBoat) { SFX.paddle(pl.stepN); spawnParticles(pl.x, pl.y + 6, 1, 'dot', ['rgba(255,255,255,0.8)', '#cfe8f8']); }
        else SFX.step(pl.stepN);
      }
      const tileKey = Math.floor(pl.x / TILE) + ',' + Math.floor(pl.y / TILE);
      if (tileKey !== pl.lastTile) {
        pl.lastTile = tileKey;
        if (!G.onBoat && tileAt(pl.x, pl.y) === T_TALL) {
          pl.grassSteps++;
          const force = G.caughtCount <= 1 && pl.grassSteps >= 3;
          if (G.encounterCooldown <= 0 && (force || Math.random() < 0.16)) {
            G.encounterCooldown = 3.5;
            startEncounter(patchPoolAt(pl.x, pl.y));
          }
        } else if (G.onBoat && tileAt(pl.x, pl.y) === T_WATER) {
          if (G.encounterCooldown <= 0 && Math.random() < 0.15) {
            G.encounterCooldown = 3.5;
            startEncounter(cur.waterPool);
          }
        }
      }
    }
  }
  // doorgang bereikt? reizen!
  G.portalCooldown = Math.max(0, (G.portalCooldown || 0) - dt);
  if (G.portalCooldown <= 0) {
    for (const po of cur.portals) {
      if (inRect(pl.x, pl.y, po.zone)) { startTravel(po); return; }
    }
  }
  // instant op en af de boot, precies op de waterlijn
  const onWater = tileAt(pl.x, pl.y) === T_WATER;
  if (onWater !== G.onBoat) {
    G.onBoat = onWater;
    SFX.board();
    spawnParticles(pl.x, pl.y + 4, 12, 'dot', ['#9fd4ff', '#ffffff', '#58b6ff']);
  }
  G.trail.push({ x: pl.x, y: pl.y });
  if (G.trail.length > 22) G.trail.shift();
  for (const b of G.butterflies) {
    b.t += dt; b.a += rand(-1.4, 1.4) * dt;
    b.x += Math.cos(b.a) * 34 * dt; b.y += Math.sin(b.a) * 34 * dt;
    if (b.x < 60 || b.x > VW - 60) b.a = Math.PI - b.a;
    if (b.y < 60 || b.y > VH - 60) b.a = -b.a;
  }
  G.sparkleT -= dt;
  if (G.sparkleT <= 0) {
    G.sparkleT = rand(0.5, 1.1);
    const roll = Math.random();
    if (cur.lanterns && roll < 0.2) { // vuurvliegjes bij de lantaarntjes
      const [lx, ly] = cur.lanterns[Math.floor(rand(0, cur.lanterns.length))];
      G.particles.push({ x: lx + rand(-26, 26), y: ly + rand(-22, 8), vx: rand(-8, 8), vy: rand(-14, -6),
        life: rand(0.9, 1.4), age: 0, type: 'dot', c: '#ffe9a8', r: 4, rot: 0, vrot: 0 });
    } else if (roll < 0.22) { // glinstering op het water
      const pc = cur.pond;
      const wx = rand(pc[0], pc[2]) * TILE, wy = rand(pc[1], pc[3]) * TILE;
      if (tileAt(wx, wy) === T_WATER) G.particles.push({ x: wx, y: wy, vx: 0, vy: -10, life: 0.9, age: 0, type: 'star', c: '#dff4ff', r: 5, rot: 0, vrot: 2 });
    } else if (roll < 0.4) { // hint bij de doorgangen
      const po = cur.portals[Math.floor(rand(0, cur.portals.length))];
      G.particles.push({ x: po.walk[0] + rand(-14, 14), y: po.walk[1] + rand(-14, 6), vx: 0, vy: -16, life: 1.0, age: 0, type: 'star', c: '#ffe9a8', r: 6, rot: 0, vrot: 2 });
    } else {
      const p = cur.patches[Math.floor(rand(0, cur.patches.length))];
      const sx = (p.x + rand(0.3, p.w - 0.3)) * TILE, sy = (p.y + rand(0.3, p.h - 0.3)) * TILE;
      G.particles.push({ x: sx, y: sy, vx: 0, vy: -14, life: 0.9, age: 0, type: 'star', c: '#fff8c8', r: 5, rot: 0, vrot: 2 });
    }
  }
}

// gezellig-schemerige avondsfeer met lichtplekjes (alleen jungle)
const lightCv = document.createElement('canvas');
lightCv.width = VW; lightCv.height = VH;
const lg2 = lightCv.getContext('2d');
function drawDusk(g) {
  lg2.globalCompositeOperation = 'source-over';
  lg2.clearRect(0, 0, VW, VH);
  lg2.fillStyle = 'rgba(18,26,58,0.3)';
  lg2.fillRect(0, 0, VW, VH);
  // lichtgaten: rond elk lantaarntje en ruim rond Julian zelf
  lg2.globalCompositeOperation = 'destination-out';
  const holes = [];
  for (const [hx, hy] of cur.lanterns) holes.push([hx, hy - 8, 100]);
  holes.push([G.player.x, G.player.y - 14, 165]);
  let i = 0;
  for (const [hx, hy, hr] of holes) {
    const r = hr * (1 + Math.sin(G.t * 5 + i * 1.7) * 0.035);
    const grd = lg2.createRadialGradient(hx, hy, r * 0.12, hx, hy, r);
    grd.addColorStop(0, 'rgba(0,0,0,0.95)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    lg2.fillStyle = grd;
    lg2.beginPath(); lg2.arc(hx, hy, r, 0, TAU); lg2.fill();
    i++;
  }
  g.drawImage(lightCv, 0, 0, VW, VH);
  // warme gloed bovenop de lantaarntjes
  i = 0;
  for (const [hx, hy] of cur.lanterns) {
    const r = 62 * (1 + Math.sin(G.t * 6 + i * 2.3) * 0.06);
    const grd = g.createRadialGradient(hx, hy - 8, 2, hx, hy - 8, r);
    grd.addColorStop(0, 'rgba(255,214,107,0.32)');
    grd.addColorStop(1, 'rgba(255,214,107,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(hx, hy - 8, r, 0, TAU); g.fill();
    i++;
  }
}

function drawWorld(g) {
  g.drawImage(cur.world, 0, 0, VW, VH);
  // bosjes-laag wiegt zachtjes mee in de wind
  const sw = Math.sin(G.t * 1.3) * 0.007 + Math.sin(G.t * 2.7) * 0.003;
  g.save(); g.transform(1, 0, sw, 1, -sw * VH * 0.55, 0);
  g.drawImage(cur.grass, 0, 0, VW, VH);
  g.restore();
  // Doorgangen zijn het luidste op het scherm: een zachte pulserende gloed plus
  // een oplichtende ring, zodat geen enkele mooie boom meer aandacht trekt.
  for (const po of cur.portals) {
    const [px, py] = po.walk;
    const pul = 0.5 + 0.5 * Math.sin(G.t * 2.1);
    const r = TILE * (1.25 + pul * 0.35);
    const gr = g.createRadialGradient(px, py - 6, TILE * 0.15, px, py - 6, r);
    gr.addColorStop(0, 'rgba(255,242,180,' + (0.34 + pul * 0.18) + ')');
    gr.addColorStop(0.55, 'rgba(255,226,120,' + (0.16 + pul * 0.1) + ')');
    gr.addColorStop(1, 'rgba(255,220,110,0)');
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(px, py - 6, r, r * 0.78, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,246,200,' + (0.5 + pul * 0.35) + ')';
    g.lineWidth = 2.4 + pul * 1.2;
    g.beginPath(); g.ellipse(px, py + 6, TILE * 0.72, TILE * 0.3, 0, 0, TAU); g.stroke();
    for (let i = 0; i < 3; i++) {                       // opstijgende vonkjes
      const k = ((G.t * 0.5 + i * 0.33) % 1);
      g.fillStyle = 'rgba(255,244,190,' + (0.7 * (1 - k)) + ')';
      const sx = px + Math.sin(G.t * 1.7 + i * 2.1) * TILE * 0.45;
      g.beginPath(); g.arc(sx, py + 4 - k * TILE * 1.5, 2.4 * (1 - k * 0.5), 0, TAU); g.fill();
    }
  }
  // draaiende molenwieken
  if (cur.millHub) {
    const [mx, my] = cur.millHub;
    g.save(); g.translate(mx, my); g.rotate(G.t * 0.7);
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(i * Math.PI / 2);
      g.fillStyle = '#e8dcc0';
      g.fillRect(-3, -52, 6, 48);
      PG(g, 'rgba(160,140,100,0.5)', [[-3, -52], [-14, -46], [-14, -14], [-3, -10]]);
      g.strokeStyle = '#9a8868'; g.lineWidth = 1.5;
      for (let r = 1; r < 4; r++) { g.beginPath(); g.moveTo(-14, -12 - r * 9); g.lineTo(-3, -14 - r * 9); g.stroke(); }
      g.restore();
    }
    g.fillStyle = '#7a5a34'; g.beginPath(); g.arc(0, 0, 5, 0, TAU); g.fill();
    g.restore();
  }
  const pl = G.player;
  if (!G.onBoat) {
    if (G.trail.length) {
      const f = G.trail[0];
      drawCreature(g, G.active, f.x, f.y - 8, 13, G.t, pl.moving ? 'happy' : 'idle', 0);
    }
    drawJulian(g, pl.x, pl.y, pl.dir, pl.moving ? 'walk' : 'idle', G.t, 1.15);
    if (tileAt(pl.x, pl.y) === T_TALL) {
      g.fillStyle = cur.style.tufts[1];
      for (let i = -1; i <= 1; i++) {
        const gx = pl.x + i * 8 + Math.sin(G.t * 1.5 + i) * 1.5;
        g.beginPath();
        g.moveTo(gx - 4, pl.y + 2); g.quadraticCurveTo(gx - 3, pl.y - 8, gx - 5, pl.y - 10);
        g.quadraticCurveTo(gx, pl.y - 7, gx + 1, pl.y - 11);
        g.quadraticCurveTo(gx + 3, pl.y - 6, gx + 5, pl.y - 8);
        g.quadraticCurveTo(gx + 5, pl.y - 3, gx + 4, pl.y + 2);
        g.closePath(); g.fill();
      }
      drawTuft(g, pl.x - 10, pl.y - 8, 1.0, cur.style.tufts[0]);
      drawTuft(g, pl.x + 4, pl.y - 6, 0.9, cur.style.tufts[0]);
    }
  } else {
    // het actieve wezen zwemt/drijft vrolijk achter de boot aan
    if (G.trail.length) {
      const f = G.trail[0];
      g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(f.x, f.y + 7, 15 + Math.sin(G.t * 3) * 2, 5, 0, 0, TAU); g.stroke();
      drawCreature(g, G.active, f.x, f.y - 4, 12, G.t, pl.moving ? 'happy' : 'idle', 0);
    }
    drawJulian(g, pl.x, pl.y + 6, pl.dir, 'paddle', G.t, 1.15);
    drawBoat(g, pl.x, pl.y + 2, G.t);
  }
  if (cur.lanterns) drawDusk(g);
  if (pl.moving && pl.tx !== null) {
    g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 3;
    const r = 10 + Math.sin(G.t * 7) * 3;
    g.beginPath(); g.arc(pl.tx, pl.ty, r, 0, TAU); g.stroke();
  }
  for (const b of G.butterflies) {
    const flap = Math.sin(b.t * 14) * 0.6;
    g.save(); g.translate(b.x, b.y); g.rotate(Math.cos(b.a) * 0.2);
    g.fillStyle = b.c;
    g.save(); g.rotate(flap); ell(g, -4.5, 0, 5, 3.2); g.restore();
    g.save(); g.rotate(-flap); ell(g, 4.5, 0, 5, 3.2); g.restore();
    g.fillStyle = '#3b3b3b'; ell(g, 0, 0, 1.6, 3.4);
    g.restore();
  }
  drawParticles(g);
}

// ============================================================ overgangen
function drawTransition(g, k) {
  const maxR = Math.hypot(VW, VH) / 2 + 60;
  g.fillStyle = '#234d23';
  g.beginPath();
  g.rect(0, 0, VW, VH);
  g.arc(VW / 2, VH / 2, Math.max(0.01, maxR * k), 0, TAU, true);
  g.fill();
}

const bookOverlay = document.getElementById('bookOverlay');
const bookGrid = document.getElementById('bookGrid');
const bookCount = document.getElementById('bookCount');
const bookBadge = document.getElementById('bookBadge');
const cells = [];
for (let i = 0; i < NSPECIES; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell uncaught';
  const tc = document.createElement('canvas');
  tc.width = 120; tc.height = 120;
  tc.getContext('2d').drawImage(thumbs[i], 0, 0);
  cell.appendChild(tc);
  // tik op een gevangen wezen om het als actief wezen te kiezen;
  // een veeg (scrollen) selecteert niet
  let sx0 = 0, sy0 = 0, moved = false;
  cell.addEventListener('pointerdown', e => { e.stopPropagation(); sx0 = e.clientX; sy0 = e.clientY; moved = false; });
  cell.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx0) > 10 || Math.abs(e.clientY - sy0) > 10) moved = true; });
  cell.addEventListener('pointerup', e => {
    e.stopPropagation();
    if (moved) return;          // dit was een scroll-veeg
    if (!G.caught[i]) return;   // lege plekjes doen niets
    const swapping = G.state === 'battle' && B.phase === 'swap';
    if (swapping && i === B.fainted) { SFX.tap(); return; }   // die slaapt nog
    if (isAsleep(i)) { SFX.tap(); return; }                   // uitgeteld van een vorig gevecht
    if (G.active !== i) {
      G.active = i;
      saveProgress();
      SFX.cry(i); SFX.sparkle();
    } else {
      SFX.tap();
    }
    refreshBook();
    if (swapping) {                                            // meteen verder vechten
      B.pMax = SPECIES[G.active].hp || 3;
      B.pHearts = B.pMax;
      if (B.used.indexOf(G.active) < 0) B.used.push(G.active);
      B.phase = 'swapIn'; B.pt = 0; B.pcIn = 0; B.fainted = -1;
      bookOverlay.style.display = 'none';
      G.bookOpen = false;
      SFX.revive();
      spawnParticles(PC.x, PC.y - 30, 18, 'star', ['#ffd23d', '#8fe05f', '#ffffff']);
    }
  });
  bookGrid.appendChild(cell);
  cells.push(cell);
}
function updateBadge() { bookBadge.textContent = G.caughtCount; }
function refreshBook() {
  for (let i = 0; i < NSPECIES; i++) {
    // De vakjes worden een keer gemaakt en over profielen heen hergebruikt, dus
    // de gevangen-staat moet beide kanten op bijgewerkt worden. Anders blijven
    // de wezens van een vorig spel zichtbaar terwijl ze niet meetellen.
    const has = G.caught[i] > 0;
    cells[i].classList.toggle('uncaught', !has);
    let stamp = cells[i].querySelector('.stamp');
    if (has && !stamp) {
      stamp = document.createElement('span');
      stamp.className = 'stamp'; stamp.textContent = '⭐';
      cells[i].appendChild(stamp);
    } else if (!has && stamp) stamp.remove();
    // slapen: net flauwgevallen in dit gevecht, of nog uitgeteld van een vorig
    const sleeping = (G.state === 'battle' && B.phase === 'swap' && i === B.fainted) || isAsleep(i);
    cells[i].classList.toggle('asleep', sleeping);
    let zzz = cells[i].querySelector('.zzz');
    if (sleeping && !zzz) {
      zzz = document.createElement('span');
      zzz.className = 'zzz'; cells[i].appendChild(zzz);
    } else if (!sleeping && zzz) zzz.remove();
    if (sleeping) {
      // hoeveel gevechten nog? dat laten de bolletjes naast het slaapicoon zien
      const n = G.asleep[i] || 0;
      cells[i].querySelector('.zzz').textContent = n > 0 ? '💤' + n : '💤';
    }
    const isActive = i === G.active && !sleeping;
    cells[i].classList.toggle('activeMon', isActive);
    let sel = cells[i].querySelector('.sel');
    if (isActive && !sel) {
      sel = document.createElement('span');
      sel.className = 'sel'; sel.textContent = '✅';
      cells[i].appendChild(sel);
    } else if (!isActive && sel) {
      sel.remove();
    }
  }
  bookCount.textContent = G.caughtCount + ' / ' + NSPECIES;
}
function openBook() {
  if (G.state !== 'world' && G.state !== 'battle') return;
  SFX.uiOpen();
  G.bookOpen = true;
  refreshBook();
  bookOverlay.style.display = 'flex';
}
function closeBook() {
  // tijdens een gevecht met een flauwgevallen maatje moet er eerst gekozen worden
  if (G.bookOpen && G.state === 'battle' && B.phase === 'swap') { SFX.tap(); return; }
  SFX.uiClose();
  bookOverlay.style.display = 'none';
  G.bookOpen = false;
}

document.getElementById('btnCloseBook').addEventListener('pointerdown', e => { e.stopPropagation(); closeBook(); });
